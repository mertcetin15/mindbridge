async function checkConnection(){
 if(location.protocol==='file:'){available=false;statusKey='unavailable';view();return;}
 const ownGeneration=generation,sequence=++healthSequence;statusKey='checking';view();const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),5000);
 try{const response=await fetch('/api/health',{signal:controller.signal,cache:'no-store',credentials:'same-origin'});const data=await response.json();if(ownGeneration!==generation||sequence!==healthSequence||busy)return;requiresLogin=data.ai_requires_login===true;available=response.ok&&data.version==='4.0.0'&&data.ai_configured===true;statusKey=available?'available':'unavailable';}
 catch(_){if(ownGeneration!==generation||sequence!==healthSequence||busy)return;available=false;statusKey='unavailable';}
 finally{clearTimeout(timeout);if(ownGeneration===generation&&sequence===healthSequence&&!busy)view();}
}
window.sendChatMessage=async()=>{
 if(busy)return;const text=input.value.trim(),language=curLang;
 if(!text){statusKey='empty';view();return;}if(text.length>2000){statusKey='long';view();return;}
 // Local human-help shortcut is available even without a provider or consent.
 const checked=normalizeRisk(text);
 if(risk.test(checked)){
  conversation.push({role:'user',content:text},{role:'assistant',content:SAFETY.crisis[language]||SAFETY.crisis.en,source:'safety'});
  conversation=conversation.slice(-40);input.value='';statusKey=available?'available':'unavailable';paintMessages();view();return;
 }
 // Indirect distress without consent or a provider: a gentle support note instead of a dead-end error.
 if(softRisk.test(checked)&&(!consent.checked||!available)){
  conversation.push({role:'user',content:text},{role:'assistant',content:SAFETY.support[language]||SAFETY.support.en,source:'safety'});
  conversation=conversation.slice(-40);input.value='';statusKey=available?'available':'unavailable';paintMessages();view();return;
 }
 if(!consent.checked){statusKey='required';view();return;}if(!available){statusKey='unavailable';view();return;}
 const ownGeneration=++generation,controller=new AbortController();let timedOut=false;
 const timeout=setTimeout(()=>{timedOut=true;controller.abort();},32000);pending={controller,timeout};busy=true;statusKey='waiting';view();
 try{
  const headers={'Content-Type':'application/json','X-MindBridge-Client':'v4'};
  if(requiresLogin){
   const session=await fetch('/api/auth/me',{credentials:'same-origin',cache:'no-store',signal:controller.signal});
   const account=await session.json();if(ownGeneration!==generation)return;
   if(!session.ok||!account.user||!account.csrf){statusKey='login';return;}
   headers['X-CSRF-Token']=account.csrf;
  }
  const response=await fetch('/api/chat',{method:'POST',headers,credentials:'same-origin',signal:controller.signal,body:JSON.stringify({mode:'ai',language,consent:true,messages:contextFor(text)})});
  const data=await response.json();if(ownGeneration!==generation)return;
  if(!response.ok){statusKey=response.status===401||data.error?.code==='csrf_required'?'login':data.error?.code==='ai_quota'?'quota':response.status===429?'rate':(data.error?.code==='ai_not_configured'||data.error?.code==='ai_disabled')?'unavailable':data.error?.code==='consent_required'?'required':data.error?.code==='provider_auth_error'?'auth':'failure';if(statusKey==='unavailable')available=false;return;}
  if(typeof data.reply!=='string'||!data.reply.trim()||data.reply.length>6000||!['ai','safety'].includes(data.source)){statusKey='invalid';return;}
  conversation.push({role:'user',content:text},{role:'assistant',content:data.reply,source:data.source});conversation=conversation.slice(-40);input.value='';statusKey='received';paintMessages();
 }catch(_){if(ownGeneration===generation)statusKey=timedOut?'timeout':'failure';}
 finally{clearTimeout(timeout);if(ownGeneration===generation){pending=null;busy=false;view();input.focus();}}
};
window.handleChatEnter=e=>{if(e.key==='Enter'&&!e.isComposing&&!e.repeat){e.preventDefault();window.sendChatMessage();}};input.addEventListener('keydown',window.handleChatEnter);
cancel.addEventListener('click',()=>stop());clear.addEventListener('click',clearChat);refresh.addEventListener('click',checkConnection);
select.addEventListener('change',()=>{mode=select.value;clearChat();statusKey=available?'available':'unavailable';view();});
const previousI18n=window.applyI18n;window.applyI18n=function(){previousI18n();view();paintMessages();};
// Prevent the legacy greeting renderer from overwriting the controlled conversation.
window.renderChatGreeting=paintMessages;
const previousPage=window.showPage;window.showPage=function(id){if(id!=='chat'&&busy)stop();return previousPage(id);};
window.addEventListener('pagehide',()=>{stop();conversation=[];input.value='';consent.checked=false;paintMessages();});
window.addEventListener('mb:account-changed',clearChat);
paintMessages();view();checkConnection();
})();

function keptState(id){const old=id?tasks.find(t=>t.id===id):null;return old&&old.status?{status:old.status,status_at:old.status_at||''}:{};}
function start(task){

 const minutes=Math.min(task.minutes,Number(budget.value));if(!Number.isInteger(minutes)||minutes<1||minutes>180)return;

 const active=tasks.filter(t=>!t.done&&Core.statusOf(t)!=='abandoned'),ready=active.filter(t=>!t.due||t.due<=today());summary.textContent=`${C().total}: ${active.length} · ${C().load}: ${ready.reduce((n,t)=>n+t.minutes,0)} ${C().min}`;

function renderSuggestion(){

function normalizeTask(value){return value.toLocaleLowerCase(curLang).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i');}

 for(const row of taskRows){const show=terms.every(term=>row.text.includes(term));if(row.card.hidden!==!show)row.card.hidden=!show;if(show)matched++;}

/* Returns the new list, or a string naming why nothing was added. */
function add(list,{id,taskId,title,at,tz},now){

<script id="mindbridge-calm-options-core">
/* When is a Self-check answer set "elevated", and which options follow. Pure functions, no storage, no network.
   Answers are 0..3 (0 = least). Elevated here means: at least two answers at 2 or higher, or any answer at 3.
   That is a description of the answers the person gave for this sitting. It is not a score, not a diagnosis and
   it is never saved or sent. */
(root=>{
'use strict';
function elevated(answers){const a=(answers||[]).filter(v=>Number.isInteger(v));return a.filter(v=>v>=2).length>=2||a.some(v=>v===3);}
// Five options, none preferred. `tool` is the tools-page card (data-i18n tools.<tool>.h) that is only opened, never started.
const OPTIONS=[{id:'breathing',tool:'breath'},{id:'grounding',tool:'ground'},{id:'journaling',tool:'journal'},{id:'break',tool:'break'},{id:'continue',tool:null}];
const api={elevated,OPTIONS};root.MBCalmOptions=api;if(typeof module!=='undefined')module.exports=api;
})(typeof window==='undefined'?globalThis:window);

</script>

const COPY={
 en:{title:'A few options, your choice',intro:'Your answers describe a heavy day. Nothing will start by itself. Pick what fits, or none.',breathing:'Breathing',grounding:'Grounding',journaling:'Journaling',break:'Take a break',continue:'Continue normally',continued:'Nothing changed. Carry on with your plan below.',limits:'Self-check only reflects the answers you gave today. It cannot tell how you are doing overall and it is not a diagnosis. If you would like to talk to a person, that is always an option.',person:'Reach a person'},

<script id="mindbridge-campus-motion">
/* Event-driven scroll motion. No perpetual RAF, timers or wheel interception. */
(function(root){
'use strict';
const clamp=n=>Math.min(1,Math.max(0,n));
function progress(top,height,viewport){return clamp((viewport*.75-top)/Math.max(1,height-viewport*.25));}
function pose(p,compact=false){return {spin:(compact?-8:-18)+p*(compact?210:720),tilt:(compact?0:-18)+p*(compact?0:48),lift:Math.sin(p*Math.PI)*(compact?-10:-24)};}
function controller({request,cancel,read,write}){let frame=null,enabled=true;
 function schedule(){if(!enabled||frame!==null)return;frame=request(()=>{frame=null;if(enabled)write(read());});}
 function setEnabled(value){enabled=value;if(!enabled&&frame!==null){cancel(frame);frame=null;}if(enabled)schedule();}
 return {schedule,setEnabled,destroy(){setEnabled(false);}};
}
const api={progress,pose,controller};root.MBCampusMotion=api;if(typeof module!=='undefined')module.exports=api;
})(typeof window==='undefined'?globalThis:window);

</script>

const stories={tr:[
['Boş dosyanın başında','Deniz, teslim tarihine üç gün kala hâlâ giriş paragrafını yazamamıştı. Her cümleyi baştan düzeltmek, ilerlediği hissini kaybettiriyordu.','O akşam iyi bir giriş yazmak yerine üç başlık ve her başlığın altına tek bir kaba cümle koydu. Ertesi gün bir arkadaşından yalnızca sıralamaya bakmasını istedi.','Ödev hemen kolaylaşmadı; ama Deniz artık boş bir dosyaya değil, değiştirebileceği bir taslağa bakıyordu.','Bugün hangi işin kusurlu ilk sürümüne izin verebilirsin?'],
['Her isteğe evet demek','Ece, grup ödevinde eksik kalan işleri sürekli üstleniyordu. Kendi bölümüne zaman kalmayınca arkadaşlarına kızıyor, sonra da bu kızgınlığı için kendini suçluyordu.','Bir toplantıda “Bu hafta kendi bölümümü ve kaynak kontrolünü yapabilirim; sunumu da üstlenemem” dedi. Grup önce sessiz kaldı, sonra işleri yeniden paylaştı.','Herkes hemen memnun olmadı. Yine de görevlerin yazılı olması Ece’nin neyi üstlendiğini bilmesini sağladı.','Sınırını açıklamak için hangi kısa cümleyi kullanabilirsin?'],
['Yeni şehirde bir tanıdık','Mert yeni şehrinde çevresinin bir anda oluşacağını düşünmüştü. Ders çıkışında herkes bir yere giderken o eve dönüyor, bunun kendi eksikliği olduğunu sanıyordu.','Bir öğrenci grubunun aynı gün yapılan yürüyüşüne üç hafta üst üste katıldı. İlk hafta çoğunlukla dinledi; ikinci hafta bir kişiye dersini sordu.','Üçüncü hafta selam veren biri vardı. Büyük bir arkadaş grubu oluşmadı ama şehir biraz daha tanıdık gelmeye başladı.','Tekrar katılabileceğin küçük bir etkinlik var mı?'],
['Düşük nottan sonraki hafta','Selin beklediğinden düşük bir not alınca bütün bölüme uygun olmadığını düşündü. Birkaç gün sınav kâğıdını tekrar açmadı.','Sonra yanlışları konu başlıklarına ayırdı ve hocasına bir örnek üzerinden nerede koptuğunu sordu. Bir sonraki çalışma planına yalnızca iki konu ekledi.','Üzüntüsü hemen geçmedi. Fakat “Ben yapamıyorum” cümlesi, üzerinde çalışabileceği daha somut sorulara dönüştü.','Bir sonucu kimliğinden ayırıp hangi bilgiye çevirebilirsin?'],
['Dinlenmeyi ertelemek','Ali bütün hafta verimli olmaya çalışmış, hafta sonuna geldiğinde basit bir alışverişi bile ağır bulmuştu. Dinlenirse daha fazla geride kalacağını düşünüyordu.','O günün listesinden iki işi çıkardı, yemek hazırladı ve kısa bir yürüyüş yaptı. Ertesi gün enerjisinin hâlâ sınırlı olduğunu fark edince bunu da planına kattı.','Bir mola bütün sorunları çözmedi. Yorgunluğu sürdüğü için bir hekimle görüşmeye karar verdi.','Bugün hangi beklentini gerçek kapasitenle eşleştirebilirsin?'],
['İlk destek görüşmesi','Zeynep bir süredir derslere gitmekte zorlanıyordu. Destek almak için yaşadıklarının yeterince ciddi olup olmadığını düşünüp randevuyu erteliyordu.','Üniversitenin danışmanlık birimine yalnızca “Bir süredir zorlanıyorum, ilk görüşme nasıl oluyor?” diye yazdı. Görüşmeden önce ne zamandır zorlandığını ve aksayan üç şeyi not aldı.','İlk görüşmede her şeyi anlatamadı. Yine de bir sonraki adımı biriyle birlikte belirlemek, tek başına karar vermekten daha mümkün geldi.','Bir görüşmede anlatmak isteyeceğin üç şey ne olurdu?']
],en:[
['Facing the blank document','With three days left, Deniz still had no opening paragraph. Rewriting every sentence made progress feel impossible.','That evening, Deniz wrote three headings and one rough sentence under each. The next day, a friend was asked to check only the order.','The assignment did not suddenly become easy. But there was now a draft to change rather than an empty document.','Which task could begin with an imperfect first version?'],
['Saying yes to every request','Ece kept taking on unfinished group work. There was little time left for her own section, and resentment was building.','At a meeting she said, “I can do my section and check the sources this week; I cannot also do the slides.” The group paused, then reassigned tasks.','Not everyone was immediately happy. A written division of work still made her responsibilities clearer.','What short sentence could explain your boundary?'],
['A familiar face in a new city','Mert expected a social circle to appear quickly after moving. Returning home alone after classes started to feel like a personal failure.','He joined the same student walking group three weeks in a row. The first week he listened; the second he asked someone about their course.','By the third week, someone greeted him. There was no instant friendship group, but the city felt a little more familiar.','Is there a small activity you could attend again?'],
['The week after a low grade','After a disappointing grade, Selin wondered whether she belonged on her course. She avoided the exam paper for several days.','She then sorted errors by topic and asked her lecturer where one worked example had gone wrong. She added just two topics to her next study plan.','The disappointment remained, but “I cannot do this” became a set of more concrete questions.','What information can you take from a result without making it your identity?'],
['Postponing rest','After a week of trying to be productive, even shopping felt heavy to Ali. He worried that resting would put him further behind.','He removed two tasks from the day, made food and went for a short walk. His energy was still limited the next day, so he adjusted his plan again.','One break did not fix everything. When the fatigue continued, he decided to speak with a clinician.','Which expectation could you adjust to your actual capacity today?'],
['A first support conversation','Zeynep had been struggling to attend classes. She kept delaying an appointment because she was unsure whether her difficulties were serious enough.','She emailed the university counselling service to ask how a first meeting worked. Beforehand, she noted how long things had been difficult and three affected activities.','She could not explain everything at the first meeting. Choosing one next step with someone still felt more manageable than deciding alone.','What three things would you want to bring to a support conversation?']

<script id="mindbridge-save-state">
/* Honest save feedback for the Journal.
   Journal text is never stored until the user presses Save, so this module only reports facts:
   - typing  -> "Not saved yet" (text lives only on this open page)
   - pressing Save -> "Saving…", then "Saved" only if the existing save code cleared the field,
     which it does solely after the write succeeded; otherwise "Not saved" and the text stays.
   - leaving the page with unsaved text asks the browser to confirm.
   Every state pairs a distinct symbol with words, so it never relies on colour alone. */
(() => {
'use strict';
const COPY={
 en:{unsaved:'Not saved yet. This text stays only on this open page until you press Save.',saving:'Saving…',failed:'Not saved. Your text is still here; you can try again.',at:'Last confirmed',leave:'You have unsaved journal text.'},
 tr:{unsaved:'Henüz kaydedilmedi. Bu yazı, Kaydet’e basana kadar yalnızca bu açık sayfada durur.',saving:'Kaydediliyor…',failed:'Kaydedilmedi. Yazın burada duruyor; yeniden deneyebilirsin.',at:'Son onay',leave:'Kaydedilmemiş günlük yazın var.'},
 de:{unsaved:'Noch nicht gespeichert. Dieser Text bleibt nur auf dieser geöffneten Seite, bis du Speichern drückst.',saving:'Wird gespeichert…',failed:'Nicht gespeichert. Dein Text ist noch da; du kannst es erneut versuchen.',at:'Zuletzt bestätigt',leave:'Du hast ungespeicherten Tagebuchtext.'},
 es:{unsaved:'Aún sin guardar. Este texto solo está en esta página abierta hasta que pulses Guardar.',saving:'Guardando…',failed:'No se guardó. Tu texto sigue aquí; puedes intentarlo de nuevo.',at:'Última confirmación',leave:'Tienes texto del diario sin guardar.'}
};
const C=()=>COPY[curLang]||COPY.en;
const input=document.getElementById('journal-input'),status=document.getElementById('journal-status');
if(!input||!status||typeof window.saveJournal!=='function')return;
const SYMBOL={unsaved:'✎',saving:'…',saved:'✓',failed:'!'};
const state=document.createElement('p');state.id='mb-journal-state';state.className='mb-save-state';
state.setAttribute('role','status');state.setAttribute('aria-live','polite');
status.before(state);
// Existing record messages were silent for screen readers.
for(const id of ['journal-status','gratitude-status']){const n=document.getElementById(id);if(n){n.setAttribute('role','status');n.setAttribute('aria-live','polite');}}
let mode='idle',confirmedAt=null,busy=false;
const clock=d=>d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
function render(){
 if(mode==='idle'){state.textContent='';state.removeAttribute('data-state');return;}
 const text=mode==='unsaved'?C().unsaved:mode==='saving'?C().saving:mode==='failed'?(status.textContent.trim()||C().failed)
  :status.textContent.trim()+(confirmedAt?' ('+C().at+' '+clock(confirmedAt)+')':'');
 state.setAttribute('data-state',mode);state.textContent=SYMBOL[mode]+' '+text;
}
input.addEventListener('input',()=>{if(busy)return;mode=input.value.trim()?'unsaved':'idle';render();});
const original=window.saveJournal;
window.saveJournal=async function(){
 if(busy)return;
 if(!input.value.trim())return original.apply(this,arguments);   // existing "write something first" message
 busy=true;mode='saving';render();
 try{await Promise.resolve(original.apply(this,arguments));}catch(e){}
 busy=false;
 // The field is emptied only by the existing code after a confirmed write.
 if(input.value.trim()===''){mode='saved';confirmedAt=new Date();}else{mode='failed';}
 render();
};
window.addEventListener('beforeunload',event=>{
 if(!input.value.trim())return;
 event.preventDefault();event.returnValue=C().leave;return C().leave;
});
const previousI18n=window.applyI18n;
window.applyI18n=function(){previousI18n();render();};
})();

</script>

<script id="mindbridge-journey">
/* Navigation that behaves like a connected site: the browser Back and Forward buttons move between the site's pages
   and a page can be opened by its address (#/library). Unknown addresses are ignored. No page content is put in the address. */
(() => {
'use strict';
const J=window.MBJourney;if(!J)return;
let applying=false,current=null;
function go(page){if(typeof window.showPage==='function')window.showPage(page);}
function remember(page,replace){
 try{const url=J.hashFor(page);if(replace)history.replaceState({mb:page},'',url);else history.pushState({mb:page},'',url);}catch(error){/* file:// or blocked: the site works without addresses */}
}
const previousShow=window.showPage;
window.showPage=function(id){
 const result=previousShow(id);
 if(J.known(id)&&!applying&&id!==current){remember(id,current===null);}
 if(J.known(id))current=id;
 return result;
};
window.addEventListener('popstate',event=>{
 const page=(event.state&&event.state.mb)||J.routeFromHash(location.hash);
 // A plain in-page anchor (the skip link, #main-content) also fires popstate. It is not one of our pages: leave the page alone.
 if(!page)return;
 applying=true;try{go(page);}finally{applying=false;}
 current=page;
});
const start=J.routeFromHash(location.hash);
// A #verify=... or #reset=... link carries a token for email-ui.js: leave the address alone so it can read it once.
if(/^#(verify|reset)=/.test(location.hash)){current='home';}
else if(start&&start!=='home'){go(start);}else{current='home';remember('home',true);}
})();

</script>
<script id="mindbridge-calm-room">
/* Opens the Dark Room from the Pause tool.
   The only button that opened it lived in a card that the tools page removes, so the room could not be
   reached at all. This puts one clearly labelled, optional button back next to breathing. The room itself
   is unchanged apart from legibility: a dark screen, one line of text, no sound, no motion, and a visible
   way out (button, or Escape). Nothing here opens it on its own. */
(() => {
'use strict';
const COPY={
 en:{button:'Quiet dark screen',hint:'A dark screen with one line of text. Nothing plays or moves. Leave with the button or the Escape key.'},
 tr:{button:'Sessiz karanlık ekran',hint:'Tek satır yazılı karanlık bir ekran. Hiçbir şey çalmaz ya da hareket etmez. Düğmeyle veya Escape tuşuyla çıkarsın.'},
 de:{button:'Ruhiger dunkler Bildschirm',hint:'Ein dunkler Bildschirm mit einer Textzeile. Nichts spielt oder bewegt sich. Verlasse ihn mit der Schaltfläche oder der Esc-Taste.'},
 es:{button:'Pantalla oscura tranquila',hint:'Una pantalla oscura con una línea de texto. Nada suena ni se mueve. Sal con el botón o con la tecla Escape.'}
};
const C=()=>COPY[curLang]||COPY.en;
const pane=document.getElementById('mb-pane-pause')||document.getElementById('mb-breath-tool')?.parentElement;
if(!pane||!document.getElementById('dark-room-overlay'))return;
function node(tag,id,cls){const n=document.createElement(tag);if(id)n.id=id;if(cls)n.className=cls;return n;}
const wrap=node('div','mb-calm-room','mb-calm-room'),button=node('button','mb-calm-room-open','btn-outline'),hint=node('p','mb-calm-room-hint','mb-calm-room-hint');
button.type='button';button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-describedby','mb-calm-room-hint');
button.addEventListener('click',()=>window.toggleDarkRoom(true));
wrap.append(button,hint);pane.append(wrap);
function paint(){button.textContent=C().button;hint.textContent=C().hint;}
const previousI18n=window.applyI18n;window.applyI18n=function(){previousI18n();paint();};
paint();
})();

</script>
