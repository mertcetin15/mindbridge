services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: mindbridge
      POSTGRES_USER: mindbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mindbridge -d mindbridge']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://mindbridge:${POSTGRES_PASSWORD}@db:5432/mindbridge
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_REQUIRE_LOGIN: '1'
volumes:
  postgres_data:
