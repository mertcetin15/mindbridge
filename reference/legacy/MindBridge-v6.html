<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindBridge — Student Mental Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<!--BUILD:HEAD-END-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--g);border-radius:10px}
:root{
  --g:#0E9C8C;--g2:#22C3AE;--g3:#CFF3EC;--g4:#EAFBF8;
  --ink:#181420;--ink2:#5B5566;--ink3:#8A8496;
  --bg:#FBF8F3;--bg2:#F3EEE4;--bg3:#ffffff;
  --border:rgba(24,20,32,.09);--border2:rgba(24,20,32,.05);
  --red:#C0392B;--amber:#B7600A;--blue:#1A56A7;
  --grad1:#FF6FB0;--grad2:#B06BFF;--grad3:#2FBFB0;--grad4:#FFC15E;
  --cursor:#6D28D9;--on-g:#fff;--fixed-dark:#16121f;
  --accent-grad:linear-gradient(90deg,var(--grad1),var(--grad2),var(--grad3),var(--grad1));
  --serif:'Space Grotesk',system-ui,sans-serif;
  --sans:'Instrument Sans',system-ui,sans-serif;
  --r:20px;--r2:12px;
  --ease:cubic-bezier(.19,1,.22,1);
  --ease-soft:cubic-bezier(.25,.46,.45,.94);
  --shadow-sm:0 2px 16px rgba(24,20,32,.05);
  --shadow-md:0 12px 40px rgba(24,20,32,.08);
  --shadow-lg:0 30px 80px rgba(24,20,32,.12);
}
[data-theme="dark"]{
  --g:#00E5D0;--g2:#00F0FF;--g3:rgba(0,229,208,.14);--g4:rgba(0,229,208,.06);
  --ink:#F5F3FF;--ink2:#C9C4DA;--ink3:#8B8599;
  --bg:#07060D;--bg2:#12101C;--bg3:#181524;
  --border:rgba(255,255,255,.12);--border2:rgba(255,255,255,.06);
  --red:#EF4444;--amber:#F59E0B;--blue:#3B82F6;
  --grad1:#FF2EB8;--grad2:#7000FF;--grad3:#00F0FF;--grad4:#FFE600;
  --cursor:#00F0FF;--on-g:#07060D;--fixed-dark:#16121f;
  --shadow-sm:0 2px 16px rgba(0,0,0,.35);
  --shadow-md:0 12px 40px rgba(0,0,0,.45);
  --shadow-lg:0 30px 80px rgba(0,0,0,.55);
}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden;cursor:none;transition:background .5s,color .5s}
body.no-custom-cursor{cursor:auto}
a{color:inherit}

/* SCROLL PROGRESS */
#scroll-progress{position:fixed;top:0;left:0;width:0%;height:3px;background:linear-gradient(90deg,var(--g),var(--g2));z-index:9999;transition:width .1s}

/* MORPH CURSOR — spring-smoothed, Apple-subtle */
#cursor{position:fixed;width:18px;height:18px;background:var(--cursor);border-radius:50%;pointer-events:none;z-index:100000;will-change:transform;transition:opacity .2s;top:0;left:0}
#cursor::before{content:'';position:absolute;width:7px;height:7px;border-radius:50%;background:var(--on-g);opacity:.9;top:3px;left:3px}
#cursor::after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:var(--on-g);opacity:.45;bottom:3px;right:3px}
#cursor-ring{position:fixed;width:38px;height:38px;border:1px solid var(--cursor);border-radius:50%;pointer-events:none;z-index:99999;will-change:transform,width,height;transition:width .35s var(--ease),height .35s var(--ease),border-radius .35s var(--ease),opacity .3s;opacity:.5;top:0;left:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--on-g);overflow:hidden;white-space:nowrap}
#cursor-ring.label-mode{background:var(--cursor);opacity:1}
#cursor.hidden,#cursor-ring.hidden{opacity:0}
@media(hover:none),(pointer:coarse){#cursor,#cursor-ring{display:none}body{cursor:auto}}

/* NOISE */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:.5}

/* PARTICLES */
#particles-container{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;background:var(--g);border-radius:50%;opacity:.15;animation:floatP linear infinite}
@keyframes floatP{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:.3}100%{transform:translateY(-10vh) scale(1);opacity:0}}

/* ORBIT BG */
#orbit-bg{position:fixed;inset:0;pointer-events:none;z-index:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.orbit-ring{position:absolute;border-radius:50%;border:1px solid;animation:orbitSpin linear infinite}
.orbit-ring:nth-child(1){width:400px;height:400px;border-color:rgba(255,111,176,.10);animation-duration:40s}
.orbit-ring:nth-child(2){width:650px;height:650px;border-color:rgba(176,107,255,.08);animation-duration:60s;animation-direction:reverse}
.orbit-ring:nth-child(3){width:900px;height:900px;border-color:rgba(47,191,176,.07);animation-duration:90s}
.orbit-ring:nth-child(4){width:1200px;height:1200px;border-color:rgba(255,193,94,.05);animation-duration:130s;animation-direction:reverse}
[data-theme="dark"] .orbit-ring:nth-child(1){border-color:rgba(255,46,184,.14)}
[data-theme="dark"] .orbit-ring:nth-child(2){border-color:rgba(112,0,255,.14)}
[data-theme="dark"] .orbit-ring:nth-child(3){border-color:rgba(0,240,255,.1)}
[data-theme="dark"] .orbit-ring:nth-child(4){border-color:rgba(255,230,0,.08)}
.aurora-blob{position:absolute;border-radius:50%;filter:blur(90px);mix-blend-mode:multiply;opacity:.5;animation:auroraDrift ease-in-out infinite}
[data-theme="dark"] .aurora-blob{mix-blend-mode:screen;opacity:.6}
.aurora-1{width:560px;height:560px;background:radial-gradient(circle,var(--grad1),transparent 70%);top:-140px;left:-100px;animation-duration:19s}
.aurora-2{width:480px;height:480px;background:radial-gradient(circle,var(--grad3),transparent 70%);bottom:-120px;right:-80px;animation-duration:23s;animation-delay:-6s}
.aurora-3{width:400px;height:400px;background:radial-gradient(circle,var(--grad4),transparent 70%);top:45%;left:60%;animation-duration:16s;animation-delay:-10s}
@keyframes auroraDrift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-40px) scale(1.12)}66%{transform:translate(-35px,35px) scale(.92)}100%{transform:translate(0,0) scale(1)}}
@keyframes orbitSpin{0%{transform:rotate(0deg) scaleX(1) scaleY(0.6)}50%{transform:rotate(180deg) scaleX(0.6) scaleY(1)}100%{transform:rotate(360deg) scaleX(1) scaleY(0.6)}}

/* PAGE TRANSITION */
#page-transition{position:fixed;top:0;left:-100%;width:100%;height:100vh;background:var(--g);z-index:999998;transition:left .6s cubic-bezier(.77,0,.175,1)}
#page-transition.active{left:0}
#page-transition.done{left:100%}

/* PRELOADER — cinematic intro */
#preloader{position:fixed;inset:0;background:var(--ink);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .9s ease,visibility .9s ease;overflow:hidden}
#preloader .pl-word{font-family:var(--serif);font-size:clamp(38px,7vw,96px);color:var(--bg);letter-spacing:-.03em;display:flex;overflow:hidden}
#preloader .pl-word span{display:inline-block;transform:translateY(110%);opacity:0}
#preloader .pl-tag{font-family:var(--sans);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--g3);opacity:0}
.pl-bar-bg{width:240px;height:2px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;opacity:0}
.pl-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--g),var(--g2));border-radius:3px}
#preloader.hide{opacity:0;visibility:hidden}

/* LANGUAGE SELECTOR */
.lang-switch{position:relative}
.lang-btn{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:40px;border:1px solid var(--border2);background:var(--bg3);color:var(--ink2);font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.04em;cursor:pointer;transition:all .25s}
.lang-btn:hover{border-color:var(--g)}
.lang-caret{font-size:9px;transition:transform .3s}
.lang-switch.open .lang-caret{transform:rotate(180deg)}
.lang-menu{position:absolute;top:calc(100% + 10px);right:0;background:var(--bg3);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.15);padding:6px;min-width:168px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transform-origin:top right;transition:all .25s cubic-bezier(.16,1,.3,1);z-index:600}
.lang-switch.open .lang-menu{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.lang-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 14px;border-radius:10px;border:none;background:transparent;color:var(--ink);font-family:var(--sans);font-size:13.5px;font-weight:600;cursor:pointer;transition:background .2s;text-align:left}
.lang-opt:hover{background:var(--g4)}
.lang-opt.active{color:var(--g)}
.lang-opt small{color:var(--ink3);font-weight:500}

/* FLOATING BUTTONS */
.controls-wrap{position:fixed;bottom:28px;right:28px;z-index:900;display:flex;gap:10px;align-items:center}
.btn-float{width:52px;height:52px;border-radius:50%;border:none;font-weight:700;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .4s cubic-bezier(.175,.885,.32,1.275)}
.btn-sos{background:var(--red);color:#fff;box-shadow:0 8px 20px rgba(192,57,43,.35);font-size:20px;font-weight:900}
.btn-sos:hover{transform:scale(1.12) rotate(10deg);box-shadow:0 14px 28px rgba(192,57,43,.5)}
.btn-theme{background:var(--bg3);color:var(--ink);border:1px solid var(--border);box-shadow:0 8px 20px var(--border2)}
.btn-theme:hover{transform:scale(1.12) rotate(-10deg)}

/* NAV */
nav{position:fixed;top:4px;left:0;right:0;z-index:500;height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;transition:height .5s var(--ease),background .5s var(--ease),box-shadow .5s var(--ease),top .5s var(--ease),backdrop-filter .5s var(--ease)}
nav.scrolled{height:62px;background:rgba(247,245,240,.72);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--border2);box-shadow:var(--shadow-sm);top:0}
[data-theme="dark"] nav.scrolled{background:rgba(15,23,42,.72)}
.nav-logo{font-family:var(--serif);font-size:22px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px;letter-spacing:-.02em;z-index:2}
.logo-orb{width:28px;height:28px;border-radius:50%;background:var(--cursor);position:relative;flex-shrink:0}
.logo-orb::before{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:var(--on-g);opacity:.9;top:5px;left:5px}
.logo-orb::after{content:'';position:absolute;width:6px;height:6px;border-radius:50%;background:var(--on-g);opacity:.45;bottom:5px;right:5px}
@keyframes logoSpin{to{transform:rotate(360deg)}}
.nav-links{display:flex;gap:2px;align-items:center;background:var(--bg3);padding:5px;border-radius:40px;border:1px solid var(--border2);box-shadow:0 4px 20px var(--border2)}
.nav-link{padding:9px 16px;border-radius:40px;font-size:13.5px;color:var(--ink2);cursor:pointer;border:none;background:transparent;transition:all .25s;font-family:var(--sans);font-weight:600;white-space:nowrap}
.nav-link:hover{color:var(--ink)}
.nav-link.quiz-link:not(.active){background:var(--bg2)}
.nav-link.active{background:var(--g);color:var(--on-g);box-shadow:0 4px 14px var(--g3)}
.nav-right{display:flex;align-items:center;gap:12px}
.magnetic{display:inline-block;padding:16px;margin:-16px}
.magnetic>*{transition:transform .35s var(--ease)!important}
.hamburger{display:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:4px}
.hamburger span{width:18px;height:2px;background:var(--ink);transition:all .3s}
.hamburger.active span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.hamburger.active span:nth-child(2){opacity:0}
.hamburger.active span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* MAIN */
main{padding-top:76px;position:relative;z-index:1}
.page{display:none;opacity:0}
.page.active{display:block;animation:pageFadeIn .7s cubic-bezier(.16,1,.3,1) forwards}
@keyframes pageFadeIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

/* REVEAL + SPLIT TEXT */
.reveal{opacity:0;transform:translateY(44px) scale(.98);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.reveal.active{opacity:1;transform:translateY(0) scale(1)}
.split-lines{overflow:hidden;display:block;padding-bottom:.18em;margin-bottom:-.18em}
.split-lines .line-inner{display:inline-block;transform:translateY(115%);transition:transform 1.05s var(--ease)}
.split-lines.active .line-inner{transform:translateY(0)}

/* BUTTONS */
@keyframes gradShift{to{background-position:300% center}}
.btn-solid{padding:16px 36px;background:var(--accent-grad);background-size:300% auto;background-position:0% center;color:#fff;border:none;border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:transform .35s var(--ease),box-shadow .4s var(--ease);box-shadow:0 10px 30px rgba(255,111,176,.3);display:inline-block;animation:gradShift 6s linear infinite}
[data-theme="dark"] .btn-solid{box-shadow:0 10px 34px rgba(255,46,184,.35)}
.btn-solid:hover{transform:scale(1.035);box-shadow:0 16px 44px rgba(255,111,176,.45)}
[data-theme="dark"] .btn-solid:hover{box-shadow:0 16px 48px rgba(0,240,255,.35)}
.btn-solid:active{transform:scale(.96);transition-duration:.12s}
.btn-outline{padding:16px 36px;background:transparent;color:var(--ink);border:1.5px solid var(--border);border-radius:40px;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .35s var(--ease)}
.btn-outline:hover{border-color:var(--ink);background:var(--bg3);transform:scale(1.025)}
.btn-outline:active{transform:scale(.96);transition-duration:.12s}
.btn-solid:focus-visible,.btn-outline:focus-visible,.nav-link:focus-visible{outline:2px solid var(--g);outline-offset:3px}

/* ── HOME / HERO ── */
.hero{min-height:96vh;display:grid;place-items:center;padding:80px 48px 60px;position:relative;overflow:hidden}
.hero-canvas{position:absolute;inset:0;z-index:0;overflow:hidden}
.hero-blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;mix-blend-mode:multiply}
[data-theme="dark"] .hero-blob{mix-blend-mode:screen;opacity:.15}
.blob-1{width:700px;height:700px;background:var(--grad1);top:-100px;right:-100px;animation:floatBlob 20s ease-in-out infinite alternate}
.blob-2{width:500px;height:500px;background:var(--grad2);bottom:-100px;left:-100px;animation:floatBlob 15s ease-in-out infinite alternate-reverse}
.blob-3{width:350px;height:350px;background:var(--grad3);top:40%;left:45%;animation:floatBlob 25s ease-in-out infinite alternate}
@keyframes floatBlob{0%{transform:translate(0,0) rotate(0deg) scale(1)}100%{transform:translate(50px,40px) rotate(20deg) scale(1.1)}}
.hero-inner{position:relative;z-index:1;text-align:center;max-width:1000px;margin:0 auto}
.hero-badge{display:inline-flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);color:var(--g);font-size:12.5px;font-weight:700;padding:8px 20px;border-radius:40px;margin-bottom:40px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 28px var(--border2);animation:slideDown 1s cubic-bezier(.16,1,.3,1)}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--g2);animation:pulseDot2 1.8s infinite}
@keyframes pulseDot2{0%,100%{box-shadow:0 0 0 0 rgba(255,111,176,.5)}50%{box-shadow:0 0 0 7px rgba(255,111,176,0)}}
[data-theme="dark"] .pulse-dot{animation:pulseDot2Dark 1.8s infinite}
@keyframes pulseDot2Dark{0%,100%{box-shadow:0 0 0 0 rgba(0,240,255,.5)}50%{box-shadow:0 0 0 7px rgba(0,240,255,0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.hero h1{font-family:var(--serif);font-size:clamp(52px,9vw,128px);font-weight:400;line-height:1.15;letter-spacing:-.035em;color:var(--ink);margin-bottom:28px}
.typewriter-text{background:var(--accent-grad);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradShift 7s linear infinite;font-style:italic;display:inline-block;position:relative}
.typewriter-text::after{content:'|';position:absolute;right:-8px;animation:blink 1s infinite;color:var(--ink3);-webkit-text-fill-color:var(--ink3)}
@keyframes blink{50%{opacity:0}}
.hero-sub{font-size:19px;color:var(--ink2);line-height:1.72;margin-bottom:44px;max-width:640px;margin-left:auto;margin-right:auto}
.hero-stat-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.2);border-radius:40px;padding:7px 18px;font-size:13.5px;color:var(--ink2);margin-bottom:40px}
.hero-stat-pill strong{color:var(--red);font-weight:700}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:44px}
.scroll-cue{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);z-index:1}
.scroll-cue-line{width:1px;height:40px;background:linear-gradient(var(--ink3),transparent);animation:scrollCue 2s ease-in-out infinite}
@keyframes scrollCue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}50.01%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* MARQUEE */
.marquee-wrap{padding:16px 0;background:var(--accent-grad);background-size:300% auto;animation:gradShift 10s linear infinite;overflow:hidden;white-space:nowrap;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1)}
.marquee-inner{display:inline-flex;animation:marqueeAnim 28s linear infinite}
.marquee-inner:hover{animation-play-state:paused}
.marquee-inner span{padding:0 26px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.9);letter-spacing:.05em;text-transform:uppercase}
.marquee-dot{color:rgba(255,255,255,.4)}
@keyframes marqueeAnim{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* STATS */
.stats-band{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:0 48px;margin-bottom:90px;perspective:1200px}
.stat-card{background:var(--bg3);padding:46px;border-radius:var(--r);border:1px solid var(--border2);box-shadow:var(--shadow-sm);transition:transform .6s var(--ease),box-shadow .6s var(--ease);transform-style:preserve-3d;cursor:default;position:relative;isolation:isolate}
.stat-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg)}
.stat-n{font-family:var(--serif);font-size:72px;color:var(--g);line-height:1;margin-bottom:14px;letter-spacing:-.04em}
.stat-d{font-size:15px;color:var(--ink2);font-weight:500;line-height:1.55}
.stat-s{font-size:11.5px;color:var(--ink3);margin-top:10px;font-style:italic}

/* SECTION */
.section{padding:110px 48px}
.sec-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--g);margin-bottom:14px}
.sec-title{font-family:var(--serif);font-size:clamp(38px,6vw,84px);line-height:1.15;color:var(--ink);margin-bottom:56px;letter-spacing:-.035em}
.sec-title em{font-style:italic;font-weight:600;background:var(--accent-grad);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradShift 7s linear infinite}

/* PILLARS */
.pillars-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pillar{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:32px 26px;transition:transform .45s var(--ease),box-shadow .45s var(--ease),border-color .45s var(--ease);position:relative;overflow:hidden;cursor:default;isolation:isolate}
.pillar::after{content:'';position:absolute;left:0;bottom:0;right:0;height:3px;background:var(--g);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease);z-index:1}
.pillar:hover{transform:translateY(-6px);box-shadow:var(--shadow-md);border-color:rgba(255,111,176,.3)}
[data-theme="dark"] .pillar:hover{border-color:rgba(0,240,255,.3)}
.pillar:hover::after{transform:scaleX(1)}
.pillar-num{font-family:var(--serif);font-size:46px;color:var(--ink3);opacity:.45;line-height:1;margin-bottom:14px;letter-spacing:-.05em}
.pillar h3{font-size:15px;font-weight:600;margin-bottom:8px}
.pillar p{font-size:13.5px;color:var(--ink2);line-height:1.65}

/* ── STORIES ── */
.stories-header{padding:68px 48px 0}
.stories-header h1{font-family:var(--serif);font-size:clamp(38px,5.5vw,72px);font-weight:400;letter-spacing:-.035em;margin-bottom:10px}
.stories-header p{font-size:15.5px;color:var(--ink2);margin-bottom:32px;max-width:540px;line-height:1.7}
.filter-row{display:flex;gap:8px;padding:0 48px 24px;flex-wrap:wrap}
.filt{padding:8px 18px;border-radius:40px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:var(--bg3);color:var(--ink2);cursor:pointer;font-family:var(--sans);transition:all .2s}
.filt:hover{border-color:var(--g);color:var(--g)}
.filt.active{background:var(--g);color:var(--on-g);border-color:var(--g)}
.stories-list{display:flex;flex-direction:column;padding:0 48px 80px}
.story-item{border-top:1px solid var(--border2);padding:34px 0;display:grid;grid-template-columns:72px 1fr auto;gap:28px;align-items:start;cursor:pointer;transition:all .2s;position:relative;border-radius:var(--r2)}
.story-item:last-child{border-bottom:1px solid var(--border2)}
.story-item::after{content:'';position:absolute;left:-48px;right:-48px;top:0;bottom:0;background:var(--g4);opacity:0;transition:opacity .2s;z-index:-1;border-radius:var(--r2)}
.story-item:hover::after{opacity:1}
.story-num{font-family:var(--serif);font-size:34px;color:var(--ink3);opacity:.5;letter-spacing:-.06em;line-height:1;padding-top:6px}
.story-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.anon-badge{display:inline-flex;align-items:center;gap:4px;background:var(--bg2);border-radius:40px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.03em}
.s-tag{font-size:11px;font-weight:700;padding:4px 10px;border-radius:40px;letter-spacing:.03em}
.story-yr{font-size:12px;color:var(--ink3)}
.story-title{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--ink);margin-bottom:8px;line-height:1.3;letter-spacing:-.02em}
.story-excerpt{font-size:14px;color:var(--ink2);line-height:1.75}
.story-full-text{display:none;font-size:14px;color:var(--ink2);line-height:1.8;margin-top:16px;padding-top:16px;border-top:1px solid var(--border2);animation:pageFadeIn .3s ease both}
.story-full-text p+p{margin-top:12px}
.story-item.open .story-full-text{display:block}
.story-expand{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink3);transition:all .25s;flex-shrink:0;background:var(--bg3)}
.story-item:hover .story-expand{border-color:var(--g);color:var(--g)}
.story-item.open .story-expand{background:var(--g);border-color:var(--g);color:var(--on-g);transform:rotate(45deg)}
.story-outcome{display:inline-flex;align-items:center;gap:6px;margin-top:16px;background:var(--g3);border-radius:var(--r2);padding:8px 14px;font-size:12.5px;color:var(--g);font-weight:600}

/* ── TOOLS ── */
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding:0 48px 90px;max-width:1400px;margin:0 auto}
.tool-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:38px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:box-shadow .5s var(--ease),transform .5s var(--ease);position:relative;isolation:isolate}
.tool-card:hover{box-shadow:var(--shadow-md);transform:translateY(-4px)}
.tool-card h3{font-size:22px;font-weight:600;margin-bottom:8px;color:var(--ink)}
.tool-card>.sub{color:var(--ink3);margin-bottom:26px;font-size:14px;line-height:1.6}
.tool-input{width:100%;resize:none;border-radius:var(--r2);padding:14px;border:1px solid var(--border);background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .25s;margin-bottom:14px}
.tool-input:focus{border-color:var(--g)}
.timer-set{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.timer-step{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg3);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .25s var(--ease)}
.timer-step:hover{border-color:var(--g);color:var(--g);transform:scale(1.08)}
.timer-step:disabled{opacity:.35;cursor:not-allowed;transform:none}
.timer-min-input{width:56px;text-align:center;font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink);background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:6px 4px;-moz-appearance:textfield}
.timer-min-input::-webkit-outer-spin-button,.timer-min-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.timer-min-input:disabled{opacity:.5}
.timer-min-label{font-size:13px;color:var(--ink3);font-weight:600}
.timer-container{position:relative;width:220px;height:220px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center}
.timer-circle{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--g) 100%,var(--bg2) 0);box-shadow:0 8px 24px var(--border2);transition:background .8s linear}
.timer-inner{position:absolute;inset:8px;background:var(--bg3);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.time-display{font-family:var(--serif);font-size:58px;color:var(--ink);line-height:1;letter-spacing:-2px}
.breath-container{position:relative;width:220px;height:220px;margin:0 auto 24px;display:flex;align-items:center;justify-content:center}
.breath-circle{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--g3));display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(26,86,167,.2)}
.breath-text{color:#fff;font-weight:700;font-size:18px;text-shadow:0 2px 8px rgba(0,0,0,.2)}
.sound-btn{padding:11px;border-radius:var(--r2);flex:1;background:transparent;border:1px solid var(--border);color:var(--ink);cursor:pointer;font-weight:600;font-family:var(--sans);transition:all .25s}
.sound-btn:hover{background:var(--bg2)}
.sound-btn.active{background:var(--g);color:var(--on-g);border-color:var(--g)}
.mood-btn{font-size:30px;background:transparent;border:2px solid transparent;border-radius:50%;padding:9px;cursor:pointer;transition:all .25s;filter:grayscale(100%);opacity:.5}
.mood-btn:hover{transform:scale(1.2);filter:grayscale(0%);opacity:1}
.mood-btn.active{filter:grayscale(0%);opacity:1;border-color:var(--g);background:var(--g4);transform:scale(1.1)}
.anti-todo-item{display:flex;align-items:center;gap:10px;background:var(--bg);padding:10px 14px;border-radius:10px;margin-bottom:8px;animation:slideDown .3s ease;text-align:left;font-size:14px}
.anti-todo-item::before{content:'✓';color:var(--g);font-weight:700;background:var(--g4);border-radius:50%;width:22px;height:22px;min-width:22px;display:flex;align-items:center;justify-content:center;font-size:11px}
.control-pill{background:var(--bg);border:1px solid var(--border);padding:6px 12px;border-radius:20px;font-size:13px;margin:4px;display:inline-block}
.pulsing-dot{width:11px;height:11px;background:var(--g);border-radius:50%;display:inline-block;animation:dotPulse 2s infinite alternate}
.pulsing-dot:nth-child(2){animation-delay:.5s}
.pulsing-dot:nth-child(3){animation-delay:1s}
@keyframes dotPulse{0%{transform:scale(.8);opacity:.3}100%{transform:scale(1.5);opacity:1}}
#zen-canvas{width:100%;height:200px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r2);cursor:crosshair;touch-action:none}
.plane-pane{flex:1;min-width:280px;border-radius:var(--r);padding:28px;display:flex;flex-direction:column;align-items:center}

/* ── QUIZ ── */
.quiz-wrap{max-width:680px;margin:0 auto;padding:68px 48px 80px}
.quiz-wrap h1{font-family:var(--serif);font-size:clamp(32px,4.5vw,54px);font-weight:400;letter-spacing:-.035em;margin-bottom:10px}
.quiz-wrap .sub-q{font-size:15.5px;color:var(--ink2);margin-bottom:48px;line-height:1.7}
.quiz-track{display:flex;gap:5px;margin-bottom:36px}
.track-seg{flex:1;height:3px;background:var(--bg2);border-radius:3px;transition:background .4s}
.track-seg.done{background:var(--g)}
.track-seg.cur{background:var(--g2)}
.q-counter{font-size:12px;color:var(--ink3);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.q-text{font-family:var(--serif);font-size:clamp(17px,2.4vw,23px);font-weight:400;color:var(--ink);margin-bottom:6px;line-height:1.4;letter-spacing:-.02em}
.q-hint{font-size:13px;color:var(--ink3);margin-bottom:26px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:9px;margin-bottom:30px}
.opt{padding:15px 19px;border:1.5px solid var(--border);border-radius:var(--r2);font-size:14.5px;color:var(--ink);cursor:pointer;transition:all .2s;text-align:left;background:var(--bg3);font-family:var(--sans);display:flex;align-items:flex-start;gap:12px;line-height:1.5}
.opt-circle{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;margin-top:2px;transition:all .2s;display:flex;align-items:center;justify-content:center}
.opt:hover{border-color:var(--g2);background:var(--g4)}
.opt.sel{border-color:var(--g);background:var(--g4)}
.opt.sel .opt-circle{background:var(--g);border-color:var(--g)}
.opt.sel .opt-circle::after{content:'';width:6px;height:6px;border-radius:50%;background:#fff}
.opt-label strong{display:block;font-weight:600;margin-bottom:2px}
.opt-label span{font-size:13px;color:var(--ink3)}
.quiz-nav-row{display:flex;justify-content:space-between;align-items:center}
.btn-next{padding:12px 26px;background:var(--g);color:var(--on-g);border:none;border-radius:40px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .22s;display:none}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(14,156,140,.3)}
.result-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:44px;animation:pageFadeIn .4s ease both}
.result-icon-wrap{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:22px}
.result-h{font-family:var(--serif);font-size:32px;font-weight:400;letter-spacing:-.02em;margin-bottom:12px}
.result-desc{font-size:14.5px;color:var(--ink2);line-height:1.8;margin-bottom:26px}
.result-recs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:28px}
.rec-item{background:var(--bg);border:1px solid var(--border2);border-radius:var(--r2);padding:14px 15px}
.rec-item strong{display:block;color:var(--ink);font-weight:600;margin-bottom:3px;font-size:13.5px}
.rec-item span{color:var(--ink2);line-height:1.5;font-size:13px}
.result-actions{display:flex;gap:9px;flex-wrap:wrap}
.btn-sm{padding:10px 19px;border-radius:40px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .2s;border:1.5px solid var(--border);background:transparent;color:var(--ink)}
.btn-sm:hover{background:var(--bg2)}
.btn-sm.solid{background:var(--g);border-color:var(--g);color:var(--on-g)}
.btn-sm.solid:hover{opacity:.88}
.quiz-dots{display:flex;gap:7px;justify-content:center;margin-bottom:30px}
.qdot{width:8px;height:8px;border-radius:50%;background:var(--bg2);transition:all .3s}
.qdot.done{background:var(--g);transform:scale(1.2)}
.qdot.cur{background:var(--g2);animation:dotPulse 1.2s ease-in-out infinite}

/* ── LIBRARY ── */
.library-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:46px;padding:0 48px 90px;max-width:1400px;margin:0 auto}
.faq-item{border-bottom:1px solid var(--border2);padding:18px 0}
.faq-question{font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px}
.faq-answer{max-height:0;overflow:hidden;transition:max-height .4s ease;color:var(--ink2);line-height:1.65;font-size:14.5px}
.faq-answer p{padding-top:14px}
.faq-item.active .faq-answer{max-height:300px}
.faq-icon{font-size:22px;color:var(--g);transition:transform .3s;flex-shrink:0}
.faq-item.active .faq-icon{transform:rotate(45deg)}
.quiet-zones{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:38px}
.zone-item{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;padding:14px;background:var(--g4);border-radius:var(--r2);border-left:4px solid var(--g)}
.zone-icon{font-size:22px}
.zone-info h4{font-size:15px;color:var(--ink);margin-bottom:4px;font-weight:600}
.zone-info p{font-size:13px;color:var(--ink2)}
.lib-section{margin-top:46px}
.lib-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:18px}
.lib-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:24px;transition:transform .4s var(--ease),box-shadow .4s var(--ease),border-color .4s var(--ease);cursor:pointer;position:relative;isolation:isolate}
.lib-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-md);border-color:var(--g)}
.lib-card h4{font-size:17px;margin-bottom:8px;color:var(--ink)}
.lib-card p{font-size:13px;color:var(--ink2);line-height:1.55}
.tag{display:inline-block;padding:3px 10px;background:var(--g4);color:var(--g);font-size:11.5px;border-radius:20px;margin-bottom:12px;font-weight:700}

/* ── CHAT ── */
.chat-container{max-width:780px;margin:0 auto;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:28px;box-shadow:0 10px 40px var(--border2);display:flex;flex-direction:column;height:62vh;min-height:480px}
.chat-history{flex-grow:1;overflow-y:auto;display:flex;flex-direction:column;gap:13px;margin-bottom:18px;padding-right:8px}
.chat-msg{padding:14px 18px;border-radius:18px;max-width:80%;line-height:1.55;font-size:14.5px;animation:pageFadeIn .3s ease-out}
.msg-user{background:var(--g);color:var(--on-g);align-self:flex-end;border-bottom-right-radius:5px}
.msg-ai{background:var(--bg2);color:var(--ink);align-self:flex-start;border-bottom-left-radius:5px}
.chat-input-area{display:flex;gap:9px}
.chat-input{flex-grow:1;padding:13px 18px;border:1px solid var(--border);border-radius:30px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;outline:none;transition:border-color .25s}
.chat-input:focus{border-color:var(--g)}
.typing-indicator{display:flex;gap:5px;padding:13px 18px;align-items:center;width:fit-content;background:var(--bg2);border-radius:18px;border-bottom-left-radius:5px;align-self:flex-start;animation:pageFadeIn .3s ease-out}
.typing-dot{width:7px;height:7px;background:var(--ink3);border-radius:50%;animation:typAnim 1.4s infinite ease-in-out both}
.typing-dot:nth-child(1){animation-delay:-.32s}
.typing-dot:nth-child(2){animation-delay:-.16s}
@keyframes typAnim{0%,80%,100%{transform:scale(0);opacity:.5}40%{transform:scale(1);opacity:1}}

/* ── TEAM ── */
.team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:36px;padding:0 48px 80px;max-width:1200px;margin:0 auto}
.team-card{perspective:1400px;height:410px}
.team-card-inner{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.175,.885,.32,1.275);transform-style:preserve-3d;cursor:pointer}
.team-card:hover .team-card-inner{transform:rotateY(180deg)}
.card-front,.card-back{position:absolute;width:100%;height:100%;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.card-front{background:var(--bg3);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;box-shadow:0 8px 28px var(--border2)}
.card-front .avatar{width:130px;height:130px;border-radius:50%;margin-bottom:22px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.card-front .avatar svg{width:58px;height:58px;position:relative;z-index:1}
.avatar-1{background:linear-gradient(135deg,var(--grad1),var(--grad2))}
.avatar-2{background:linear-gradient(135deg,var(--grad3),var(--grad2))}
.avatar-3{background:linear-gradient(135deg,var(--grad4),var(--grad1))}
.card-back{background:var(--fixed-dark);color:#F5F3FF;transform:rotateY(180deg);padding:38px;display:flex;flex-direction:column;justify-content:center}
.card-back h3{font-family:var(--serif);font-size:24px;margin-bottom:13px;color:#7CF0E3}
.card-back p{font-size:14.5px;line-height:1.7;opacity:.9}

/* ── CONTACT ── */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding:0 48px 90px;max-width:1300px;margin:0 auto}
.contact-card{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:40px;box-shadow:var(--shadow-sm);transition:transform .45s var(--ease),box-shadow .45s var(--ease);position:relative;isolation:isolate}
.contact-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md)}
.contact-card h3{font-family:var(--serif);font-size:24px;margin-bottom:10px}
.contact-card p{color:var(--ink2);margin-bottom:24px;font-size:14.5px;line-height:1.65}
.contact-card.highlight{background:var(--g4);border-color:var(--g);grid-column:1/-1}
.contact-card.highlight h3{color:var(--g)}

/* ── ABOUT ORBIT ── */
.about-hero{position:relative;min-height:400px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:80px 48px}
.about-rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.a-ring{position:absolute;border-radius:50%;border:1px solid;animation:orbitSpin linear infinite}
.a-ring:nth-child(1){width:260px;height:260px;border-color:rgba(255,111,176,.14);animation-duration:25s}
.a-ring:nth-child(2){width:420px;height:420px;border-color:rgba(176,107,255,.1);animation-duration:40s;animation-direction:reverse}
.a-ring:nth-child(3){width:580px;height:580px;border-color:rgba(47,191,176,.08);animation-duration:60s}
.about-content{position:relative;z-index:1;text-align:center;max-width:680px}

/* FOOTER */
footer{background:var(--fixed-dark);padding:80px 48px;color:#F5F3FF;text-align:center;border-top-left-radius:36px;border-top-right-radius:36px;margin-top:40px;position:relative;z-index:1}
.foot-logo{font-family:var(--serif);font-size:44px;margin-bottom:16px}
.social-link{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:12px 24px;border:1px solid rgba(255,255,255,.18);border-radius:30px;color:#F5F3FF;text-decoration:none;font-weight:600;font-size:14px;transition:all .3s}
.social-link:hover{background:var(--grad3);border-color:var(--grad3);color:#07060D;transform:translateY(-3px)}
.social-link svg{width:18px;height:18px;fill:currentColor}

[data-theme="dark"] .result-h{color:var(--ink)!important}

/* SPOTLIGHT HOVER GLOW (Apple-card style) */
.stat-card::before,.pillar::before,.tool-card::before,.lib-card::before,.contact-card::before{
  content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;z-index:0;
  transition:opacity .5s var(--ease);
  background:radial-gradient(480px circle at var(--mx,50%) var(--my,50%),rgba(255,111,176,.14),transparent 62%);
}
[data-theme="dark"] .stat-card::before,[data-theme="dark"] .pillar::before,[data-theme="dark"] .tool-card::before,[data-theme="dark"] .lib-card::before,[data-theme="dark"] .contact-card::before{
  background:radial-gradient(480px circle at var(--mx,50%) var(--my,50%),rgba(0,240,255,.18),transparent 62%);
}
.stat-card:hover::before,.pillar:hover::before,.tool-card:hover::before,.lib-card:hover::before,.contact-card:hover::before{opacity:1}

/* BACK TO TOP */
#back-to-top{position:fixed;bottom:28px;left:28px;z-index:900;width:48px;height:48px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);color:var(--ink);box-shadow:var(--shadow-md);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:0;visibility:hidden;transform:translateY(12px) scale(.9);transition:all .45s var(--ease)}
#back-to-top.visible{opacity:1;visibility:visible;transform:translateY(0) scale(1)}

ground:{h:"Anxiety Grounding",d:"A 5-step sensory technique to bring you back to the present moment.",btn:"Next Step",again:"Start Again",steps:[{icon:"👀",text:"Acknowledge <strong>5 things</strong> you can see around you right now."},{icon:"✋",text:"Touch <strong>4 things</strong> near you and notice how they feel."},{icon:"👂",text:"Listen for <strong>3 sounds</strong> in your environment right now."},{icon:"👃",text:"Notice <strong>2 things</strong> you can smell, or two things you like the smell of."},{icon:"👅",text:"Notice <strong>1 thing</strong> you can taste. You are back in the present moment."},{icon:"✨",text:"<strong>Grounding complete.</strong> Take one long, slow breath. You are here. You are safe."}]},
sound:{h:"Ambient Soundscapes",d:"Block campus noise. Select a background track for deep focus.",rain:"🌧️ Rain",cafe:"☕ Cafe",lofi:"🎧 Lofi",names:["Rain","Cafe","Lofi"],playing:"Playing"},
gratitude:{h:"Micro-Gratitude",d:"Rewire your brain's negativity bias by logging one small positive thing today.",ph:"e.g. A good cup of coffee...",btn:"Log Gratitude",saved:"Saved!"},
affirm:{h:"Affirmation Deck",d:"Draw a random affirmation card to reframe your mindset when self-doubt hits.",btn:"Draw New Card",cards:["I am more than my academic performance.","I am capable of handling things I haven't prepared for.","Rest is a productive part of my learning process.","My worth is not defined by my productivity today.","I give myself permission to learn at my own pace.","Asking for help is a sign of strength.","I am doing the best I can, and that is enough.","A single grade does not determine my future.","I am allowed to take up space.","Progress, not perfection."]},
break:{h:"Mindful Break",d:"Generate a 2-minute offline task to disconnect from your screen.",cta:"Click below to generate a task.",btn:"Give me a break",tasks:["Look out a window and find 3 green objects.","Stand up and stretch your arms high for 15 seconds.","Drink a large glass of cold water right now.","Close your eyes and focus on your breath for 60 seconds.","Roll your shoulders backwards 5 times, then forwards 5 times.","Text a friend you haven't spoken to recently.","Hold an object near you and examine its texture for 30 seconds."]},
mood:{h:"Daily Check-in",d:"How are you feeling about your workload today? Tracking builds self-awareness.",saved:"Mood saved. Thanks for checking in."},
canvas:{h:"Zen Canvas",d:"Draw calming ripples. Watch them gently fade — like passing thoughts."},
planes:{h:"Paper Planes",d:"An anonymous empathy wall. Read a note from a fellow student, or fold one to brighten someone else's day.",catchDefault:"“Catch a plane to read a message.”",catchBtn:"Catch a Plane ✈️",ph:"Write an encouraging note for another student...",foldBtn:"Fold &amp; Throw 🚀",flew:"Flew away successfully!",messages:["It gets better, I promise. Keep pushing.","You survived 100% of your bad days.","Take a deep breath — you're doing fine.","Grades don't define your worth as a human.","I'm proud of you just for showing up today.","Resting is not a waste of time.","Someone out there is rooting for you right now.","It's okay to not have it all figured out.","You are enough, exactly as you are.","One day at a time. That's all."]}
},
library:{badge:"Resources & Guidance",title:"Knowledge is <em>support</em>.",faqHeading:"Frequently Asked Questions",resHeading:"Curated Mental Health Resources",resSub:"Articles, podcasts, and guides vetted by university psychology staff.",zonesHeading:"Campus Quiet Zones",zonesSub:"Designated areas strictly for silence. No group work allowed.",
faq:[{q:"How do I book a university counsellor?",a:"You can book an initial consultation via the online student portal under “Wellbeing Services”. The typical wait time is currently 1–2 weeks for non-emergencies. Same-day crisis slots are usually available if needed."},{q:"Will seeing a counsellor affect my academic record?",a:"Absolutely not. Mental health records are completely confidential and are physically and digitally separated from your academic transcripts. Your tutors will never be informed without your explicit consent."},{q:"What is a deadline extension due to burnout?",a:"If you are experiencing severe burnout, you can apply for “Extenuating Circumstances,” which grants a 7-day extension without a doctor's note for your first request. Speak to your personal tutor or the student welfare office."},{q:"How can I join the MindBridge Discord?",a:"The Discord is open to all enrolled students. Check our Instagram bio at @mindbridge.eu for the weekly rotating secure invite link to protect against spam."},{q:"I'm not in crisis — is counselling still for me?",a:"Yes. You do not need to be in crisis to benefit from counselling. Many students find it helpful for general stress, direction, relationships, or academic confidence. Think of it like physiotherapy — you don't wait until you're broken."},{q:"Are there financial support options for students?",a:"Yes. Most universities offer hardship funds, emergency bursaries, and food pantry access that are not widely advertised. Contact the student welfare office or the student union to find out what's available. Financial stress has a direct impact on mental health — both are valid reasons to reach out."}],faq:[{q:"Where can I find support?",a:"Check your university’s official website for counselling and student-support services. Availability, cost, confidentiality rules, and appointment times vary by institution."},{q:"Is MindBridge a clinical service?",a:"No. MindBridge is a student wellbeing demo and does not provide diagnosis, treatment, or emergency response."},{q:"What should I do in an emergency in Germany?",a:"If there is immediate danger, call 112. For confidential emotional support, contact TelefonSeelsorge at 116 123."}],

chat:{badge:"AI Support Companion",title:"A safe space to <em>vent</em>.",sub:"Our smart AI companion offers tailored coping strategies. Not a replacement for professional therapy — but here to listen 24/7.",ph:"Type your message here...",send:"Send",greetingMsg:"Hello! I'm the MindBridge AI companion. This is a safe, judgement-free space. How are you feeling today?",
R:{greeting:["Hello! I'm here to listen — this is a safe space. How are things going?","Hi there. Whatever you're feeling, you don't have to carry it alone. What's on your mind?"],
stress:["Academic pressure can feel impossibly heavy. Try breaking one task into its smallest possible step — just the very next action. Have you tried our Focus Hub?","Exams and deadlines are stressful, but your grades don't define your worth. What's the one thing that feels most overwhelming right now?","It sounds like you have a lot on your plate. The 4-7-8 breathing exercise can help reset your nervous system in under 5 minutes."],
sadness:["I'm really sorry you're feeling this way — it takes courage to put that into words. You are not alone in this.","That sounds really difficult. Your feelings are completely valid. If it would help, our campus counsellors are available and it's free.","I hear you. Holding onto sadness is exhausting. I'm here to listen as long as you need."],
burnout:["Burnout is your body asking for a break. Rest is not laziness — it's part of performing well. Can you protect even one hour tonight?","You've been pushing hard for a long time. Try the Mindful Break generator for a 2-minute screen reset. Small breaks prevent big crashes.","Exhaustion is real. Make sure you're drinking water and eating. Physical basics have a direct impact on mental state."],
positive:["I'm glad to hear that! Protecting the good moments is just as important as working through the hard ones.","That's wonderful. Small wins matter just as much as the big ones. Keep that momentum going.","Great to hear. You deserve to feel good. Keep it up!"],
default:["I understand. Can you tell me a bit more about how that's making you feel?","Thank you for sharing that — it takes courage. Whatever you're going through, taking it one day at a time is enough.","I'm here for you. Sometimes just putting it into words is its own kind of relief."]}
},
team:{badge:"The Founders",title:"Architects of <em>MindBridge</em>.",m1role:"Lead Developer & Co-Founder",m1bio:"Architecting MindBridge's digital ecosystem. As a software engineering student, Yiğit focuses on building clean, robust backend infrastructures using Python and Java. He ensures our platform's logic is as structured and resilient as possible.",m2role:"Head of Design & Co-Founder",m2bio:"Bringing a 'quiet luxury' aesthetic to digital wellness. Mert believes mental health tools shouldn't feel clinical. He crafts intuitive, minimalist, and calming user interfaces that prioritise peace of mind without visual clutter.",m3role:"Community & Strategy Lead",m3bio:"Bridging the gap between the platform and campus. Onur strategises community outreach, ensuring our tools translate into real-world impact. He transforms digital engagement into genuine, tangible support networks for students."},
contact:{badge:"Get in Touch",title:"We're here<br>for <em>you</em>.",sub:"Whether you need professional support, want to share feedback, or just have a question — reach out. Every message matters.",proH:"Crisis and immediate support",proD:"MindBridge is an independent demo and is not a clinical service. In Germany, TelefonSeelsorge offers free, confidential support at 116 123. For immediate danger, call 112. Check official university channels for campus counselling options.",callBtn:"Call TelefonSeelsorge — 116 123",bookBtn:"Official support information",bookAlert:"",fbH:"Anonymous Feedback",fbD:"Have an idea for a new tool? Found a bug? Want to share how MindBridge helped you? Feedback is not transmitted in this demo; a backend must be connected before submissions can be received.",fbPh:"Your message here...",fbBtn:"Send Anonymously",fbSent:"Demo only: feedback is not sent or stored. A backend connection is required.",igH:"Follow on Instagram",igD:"Social links and community activity are not connected in this demo.",dcH:"Join our Discord",dcD:"Community features are planned for a future release. No live community or student count is connected in this demo.",dcBtn:"Join Server →"},
quiz:{eyebrow:"Anonymous Self-Check",title:"How are you, <em>really</em>?",sub:"5 questions. Under 2 minutes. Your answers are not stored or shared. You'll receive a personalised reflection and concrete next steps at the end.",next:"Next question →",qCounter:"Question",of:"of",selectPrompt:"Select an answer to continue",retake:"Retake",exploreTools:"Explore Tools →",getSupport:"Get Support →",
QS:[
{q:"Over the past two weeks, how often have you felt tired, drained, or lacking in energy?",hint:"Think about both physical and mental energy — not just sleep quantity.",opts:[{l:"Rarely or not at all",s:0,d:"Your energy levels seem relatively stable."},{l:"Some days",s:1,d:"Mild tiredness that comes and goes."},{l:"More days than not",s:2,d:"Persistent low energy is worth paying attention to."},{l:"Nearly every day",s:3,d:"This level of exhaustion can significantly affect your functioning."}]},
{q:"How often have you felt nervous, anxious, or on edge in the past two weeks?",hint:"Include low-grade worry, racing thoughts, or a general sense of unease.",opts:[{l:"Not at all",s:0,d:"Anxiety doesn't appear to be a significant factor right now."},{l:"Occasionally",s:1,d:"Manageable, situational anxiety."},{l:"Several days a week",s:2,d:"Anxiety affecting your day-to-day experience."},{l:"Almost constantly",s:3,d:"High anxiety that deserves proper support."}]},
{q:"In the past month, how connected do you feel to the people around you at university?",hint:"Includes classmates, flatmates, friends, or anyone on campus.",opts:[{l:"Very connected — I have people I can rely on",s:0,d:"Strong social support is the most protective factor for mental health."},{l:"Somewhat connected",s:1,d:"Some connections, but perhaps not as deep as you'd like."},{l:"Fairly isolated",s:2,d:"Social isolation at university is common but shouldn't go unaddressed."},{l:"Very isolated — I rarely interact meaningfully",s:3,d:"Significant isolation worth addressing directly."}]},
{q:"How would you describe your ability to concentrate on studying or academic work lately?",hint:"Not just when tired — your general capacity to focus when you sit down.",opts:[{l:"Good — I can focus when I need to",s:0,d:"Concentration seems intact."},{l:"Variable — some good days, some difficult ones",s:1,d:"Fluctuating focus is normal but worth monitoring."},{l:"Difficult — I often sit down and achieve little",s:2,d:"Concentration difficulties often signal underlying stress."},{l:"Very difficult — even simple tasks feel overwhelming",s:3,d:"This level of difficulty suggests significant mental load."}]},
{q:"When you face a difficult period, which of these best describes your response?",hint:"There's no right answer — this helps us understand what support might suit you.",opts:[{l:"I manage with my own strategies",s:0,d:"Good self-regulation skills in place."},{l:"I reach out to people I trust",s:1,d:"Social coping is a genuine strength."},{l:"I withdraw and deal with it alone",s:2,d:"Solitary coping can work short-term but has limits."},{l:"I feel stuck and can't take any action",s:3,d:"Feeling frozen is a signal worth taking seriously."}]}
],
RESULTS:[
{range:[0,4],emoji:"🌱",bg:"#EAFBF8",col:"#0E6B5F",label:"You seem to be coping well",desc:"Your responses suggest you're managing fairly well right now. That doesn't mean everything is perfect — but your foundations seem solid. The best thing you can do is protect what's working: maintain routines, keep social connections, and check in with yourself regularly.",recs:[{t:"Stay consistent",d:"Small daily habits compound. Sleep, movement, and regular meals matter more than any single intervention."},{t:"Be a resource for others",d:"If you're in a good place, consider the peer ambassador programme or joining #study-together."},{t:"Monitor gently",d:"Revisit this check-in in a few weeks, especially during high-pressure periods."},{t:"Explore peer stories",d:"Read the stories — not because you need to, but because understanding others builds empathy."}]},
{range:[5,9],emoji:"🌤",bg:"#FFFBEB",col:"#92400E",label:"Moderate stress — worth addressing",desc:"Your responses indicate a moderate level of stress, fatigue, or social disconnection. This is very common among university students — but 'common' doesn't mean you should push through it. Unaddressed moderate stress tends to accumulate. Relatively small adjustments can make a meaningful difference now.",recs:[{t:"Connect with community",d:"Join the MindBridge Discord — especially #study-together or #general-chat. Presence alone helps."},{t:"Talk to someone",d:"A trusted friend, a peer ambassador, or a counsellor. You don't need to be in crisis to benefit from talking."},{t:"One micro-habit",d:"A 10-minute walk, consistent sleep time, or a meal away from a screen. Choose one and repeat it for a week."},{t:"Know your options",d:"Look up your university counselling service now — before you need it urgently — to lower the barrier."}]},
{range:[10,15],emoji:"🌧",bg:"#FFF0F0",col:"#991B1B",label:"High stress — please don't wait",desc:"Your responses suggest you're carrying significant stress, exhaustion, or distress right now. This level of strain affects sleep, concentration, relationships, and your ability to study. It can become self-reinforcing if unaddressed. You deserve support — not when things get worse, but right now.",recs:[{t:"Book a counselling appointment",d:"Contact university counselling services today. You don't need a 'serious enough' reason. Struggling is enough."},{t:"Speak to your personal tutor",d:"They can flag academic accommodations, extensions, or referrals you may not know exist."},{t:"Talk to someone today",d:"A friend, family member, or MindBridge peer ambassador. You do not have to navigate this alone."},{t:"Crisis resources available",d:"If things feel urgent, call 116 123 (TelefonSeelsorge, 24/7, free) or use the ! button on this site."}]}
]},

stories_data:[
{tag:"stress transition",n:"01",badges:[{t:"Exam stress",bg:"#FEF3C7",c:"#92400E"},{t:"First year",bg:"#E0F2FE",c:"#075985"}],year:"2024",title:"“I thought everyone else had it figured out. I was the only one falling apart.”",excerpt:"During my first exam period I couldn't sleep for three nights in a row. I kept refreshing the university portal, convinced I'd failed everything before results were even published...",full:["During my first exam period I couldn't sleep for three nights in a row. I kept refreshing the university portal, convinced I'd failed everything before results were even published. In seminars I'd go completely silent, terrified that if I spoke, people would realise I didn't belong there. I called my mum once but hung up before she answered because I didn't know what to say.","Someone in my hall posted a MindBridge Instagram story about exam anxiety. I read it three times. It described exactly what I was feeling — not as a crisis, just as something real and shared. That was the first time I thought maybe I wasn't broken. I used the self-check tool, which suggested I reach out to the counselling office. I made an appointment that afternoon. Six weeks later, I got through it.","What I wish someone had told me sooner: struggling in first year doesn't mean you made the wrong choice. It means you're human."],outcome:"Completed counselling programme, now a peer ambassador"},
{tag:"social identity",n:"02",badges:[{t:"Identity",bg:"#F3E8FF",c:"#6B21A8"},{t:"International student",bg:"#FCE7F3",c:"#9D174D"}],year:"2024",title:"“Nobody warned me that moving countries for a degree could feel like losing yourself.”",excerpt:"I moved to study here and within two months I had stopped speaking to most of my flatmates — not because they were unkind, but because every interaction felt like a performance I wasn't prepared for...",full:["I moved to study here and within two months I had stopped speaking to most of my flatmates — not because they were unkind, but because every interaction felt like a performance I wasn't prepared for. My language was fine, but humour, timing, cultural references — everything felt slightly off. I started eating alone and telling my family I was having the time of my life.","I found the MindBridge Discord through a Reddit post. There was a channel specifically for international students. I didn't write anything for two weeks — I just read. Then someone posted at 2am saying they felt invisible on campus, and twelve people replied within the hour. I wrote something for the first time. Someone from my home region replied.","The loneliness didn't disappear overnight. But I stopped performing. I started learning that fitting in and belonging are two very different things — only one of them is worth chasing."],outcome:"Co-facilitates the international student weekly session on Discord"},
{tag:"burnout stress",n:"03",badges:[{t:"Burnout",bg:"#FEF2F2",c:"#991B1B"},{t:"Master's student",bg:"#F0FDF4",c:"#166534"}],year:"2023",title:"“I was hitting every deadline and failing at everything that actually mattered.”",excerpt:"Second year of my master's. I was submitting everything on time, getting decent grades. Externally I was fine. Internally I had stopped feeling anything at all...",full:["Second year of my master's. Submitting everything on time, getting decent grades, attending all my seminars. Externally I was fine. Internally I had stopped feeling anything at all. I'd sit in the library for five hours and produce maybe 200 words. I stopped replying to friends. I told myself I just needed to get through the semester.","A MindBridge TikTok listed the signs of academic burnout — low motivation, emotional numbness, physical exhaustion. I had every single one. I'd been calling it laziness for months. Naming it changed something.","The self-check tool suggested I look into a deadline extension. I hadn't known extensions existed without a formal medical certificate. I applied. My department was completely understanding. I completed the degree seven weeks later.","The system has more flexibility than anyone tells you. MindBridge told me to ask."],outcome:"Completed master's degree. Volunteers for the content team"},
{tag:"social transition",n:"04",badges:[{t:"Social isolation",bg:"#E0F2FE",c:"#075985"},{t:"2nd year",bg:"#FEF3C7",c:"#92400E"}],year:"2024",title:"“Second year was harder than first year. Nobody warned me about the second-year dip.”",excerpt:"First year had built-in social structure: flatmates, freshers events, organised chaos. Second year I moved into a house with people I'd met once. The campus emptied out...",full:["First year had built-in social structure: flatmates, freshers events, organised chaos. Second year I moved into a house with people I'd met once. The campus emptied out between lectures. I had more independence and less to do with it. I started spending whole weekends without speaking to anyone in person.","I joined the MindBridge Discord mostly to procrastinate. The #study-together channel had people working in real-time — no video, no pressure, just timestamps and check-ins. I started joining every morning. Within a month I had a loose routine built around other people's rhythms. It sounds small. It helped enormously.","What I needed wasn't therapy or intervention — it was structure and presence. The community gave me that."],outcome:"Now organises weekly #study-together co-working sessions"},
{tag:"identity burnout",n:"05",badges:[{t:"Identity",bg:"#F3E8FF",c:"#6B21A8"},{t:"Burnout",bg:"#FEF2F2",c:"#991B1B"}],year:"2024",title:"“I was studying something I no longer believed in. Admitting that felt like failure.”",excerpt:"Halfway through second year I realised I had chosen the wrong degree — not the wrong university, the wrong subject. Changing course felt like admitting I'd wasted everyone's time...",full:["Halfway through second year I realised I had chosen the wrong degree — not the wrong university, the wrong subject. Everything I studied felt disconnected from what I actually wanted. But I couldn't say that. Changing course felt like admitting I'd wasted everyone's time and money.","I started skipping lectures. Then tutorials. Attendance dropped to around 40%. I told my parents everything was fine. Inside I was in a constant low-level panic, cycling between guilt, boredom, and dread.","A MindBridge Instagram post asked: “Are you struggling with your studies, or struggling with the direction?” I took a screenshot and looked at it for a week. Then I booked an appointment with an academic advisor. There were more options than I thought. I transferred programmes the following semester.","I'm now studying what I actually wanted. My attendance is 94%. Changing your mind isn't failure. Staying somewhere that's wrong for you is a much harder path."],outcome:"Successfully transferred programmes. 94% attendance in new course"},
{tag:"stress social",n:"06",badges:[{t:"Financial stress",bg:"#FEF3C7",c:"#92400E"},{t:"Part-time student",bg:"#F0FDF4",c:"#166534"}],year:"2023",title:"“I was working 25 hours a week and pretending that was normal. It wasn't.”",excerpt:"I paid for most of my degree myself. That meant working two days a week at minimum wage and trying to act like a full-time student the other five. I was always behind, always apologising...",full:["I paid for most of my degree myself — working two days a week, trying to act like a full-time student the other five. I was always behind, always apologising for being tired, always comparing myself to classmates who had time to do the reading twice.","The stress wasn't just academic — it was the shame of it. The sense that I needed to hide the fact that I was struggling financially. I didn't talk about it because I thought it made me look less serious.","A MindBridge newsletter had an issue about financial wellbeing and the mental health impact of economic pressure. It listed hardship funds, bursaries, and food bank access I hadn't known existed. I applied for two funds. I received one. It covered a month of rent.","Financial stress and mental health aren't separate conversations. I'm glad MindBridge treats them as connected."],outcome:"Received hardship bursary. Now advises on the newsletter editorial team"}
]
};

faq:[{q:"Üniversite danışmanından nasıl randevu alırım?",a:"Öğrenci portalındaki “Refah Hizmetleri” bölümünden ilk görüşme için randevu alabilirsiniz. Acil olmayan durumlarda bekleme süresi genellikle 1-2 haftadır. Gerekirse aynı gün kriz randevusu genellikle mevcuttur."},{q:"Danışman görmek akademik kaydımı etkiler mi?",a:"Kesinlikle hayır. Ruh sağlığı kayıtları tamamen gizlidir ve akademik transkriptlerinizden fiziksel ve dijital olarak ayrıdır. Danışmanlarınız açık rızanız olmadan asla bilgilendirilmez."},{q:"Tükenmişlik nedeniyle son teslim tarihi uzatması nedir?",a:"Ciddi tükenmişlik yaşıyorsanız, ilk talebiniz için doktor raporu olmadan 7 günlük uzatma sağlayan “Hafifletici Durumlar”a başvurabilirsiniz. Danışman hocanız veya öğrenci refah ofisiyle konuşun."},{q:"MindBridge Discord'una nasıl katılabilirim?",a:"Discord tüm kayıtlı öğrencilere açıktır. Spam'e karşı korumak için haftalık dönen güvenli davet linki için Instagram bio'muza (@mindbridge.eu) bakın."},{q:"Kriz durumunda değilim — danışmanlık yine de benim için mi?",a:"Evet. Danışmanlıktan faydalanmak için kriz durumunda olmanıza gerek yok. Birçok öğrenci bunu genel stres, yön bulma, ilişkiler veya akademik özgüven için yararlı buluyor. Bunu fizyoterapi gibi düşünün — kırılana kadar beklemezsiniz."},{q:"Öğrenciler için mali destek seçenekleri var mı?",a:"Evet. Çoğu üniversite, yaygın olarak duyurulmayan zorluk fonları, acil burslar ve gıda bankası erişimi sunar. Mevcut olanları öğrenmek için öğrenci refah ofisi veya öğrenci birliğiyle iletişime geçin. Mali stresin ruh sağlığı üzerinde doğrudan etkisi vardır — ikisi de yardım istemek için geçerli nedenlerdir."}],faq:[{q:"Destek hizmetlerini nereden bulabilirim?",a:"Üniversitenin resmî web sitesinden psikolojik danışmanlık ve öğrenci destek hizmetlerini kontrol et. Hizmet, ücret, gizlilik kuralları ve randevu süreleri kuruma göre değişir."},{q:"MindBridge klinik bir hizmet mi?",a:"Hayır. MindBridge bir öğrenci iyi oluş demo projesidir; teşhis, tedavi veya acil müdahale sunmaz."},{q:"Almanya’da acil durumda ne yapmalıyım?",a:"Acil ve doğrudan tehlikede 112’yi ara. Gizli duygusal destek için TelefonSeelsorge 116 123 numarasına ulaşabilirsin."}],

chat:{badge:"AI Destek Arkadaşı",title:"<em>İçini dökmek</em> için güvenli bir alan.",sub:"Akıllı AI arkadaşımız kişiye özel baş etme stratejileri sunar. Profesyonel terapinin yerini tutmaz — ama 7/24 seni dinlemek için burada.",ph:"Mesajını buraya yaz...",send:"Gönder",greetingMsg:"Merhaba! Ben MindBridge AI arkadaşıyım. Burası güvenli, yargılamayan bir alan. Bugün nasıl hissediyorsun?",
R:{greeting:["Merhaba! Seni dinlemek için buradayım — burası güvenli bir alan. İşler nasıl gidiyor?","Selam. Ne hissediyorsan hissediyor ol, bunu tek başına taşımak zorunda değilsin. Aklında ne var?"],
stress:["Akademik baskı imkansız derecede ağır gelebilir. Bir görevi mümkün olan en küçük adıma bölmeyi dene — sadece bir sonraki adım. Odak Merkezimizi denedin mi?","Sınavlar ve son teslim tarihleri stresli, ama notların değerini tanımlamaz. Şu anda en bunaltıcı gelen tek şey ne?","Üzerinde çok şey varmış gibi görünüyor. 4-7-8 nefes egzersizi sinir sistemini 5 dakikadan kısa sürede sıfırlamaya yardımcı olabilir."],
sadness:["Böyle hissettiğin için gerçekten üzgünüm — bunu kelimelere dökmek cesaret ister. Bunda yalnız değilsin.","Bu gerçekten zor görünüyor. Duyguların tamamen geçerli. Yardımcı olacaksa, kampüs danışmanlarımız mevcut ve ücretsiz.","Seni duyuyorum. Üzüntüyü taşımak yorucudur. İhtiyacın olduğu sürece dinlemek için buradayım."],
burnout:["Tükenmişlik, bedeninin mola istemesidir. Dinlenmek tembellik değil — iyi performans göstermenin bir parçası. Bu gece en azından bir saati koruyabilir misin?","Uzun süredir kendini zorluyorsun. 2 dakikalık ekran sıfırlaması için Bilinçli Mola üreticisini dene. Küçük molalar büyük çöküşleri önler.","Tükenmişlik gerçek. Su içtiğinden ve yemek yediğinden emin ol. Fiziksel temeller zihinsel durumu doğrudan etkiler."],
positive:["Bunu duyduğuma sevindim! İyi anları korumak, zor anlarla baş etmek kadar önemlidir.","Bu harika. Küçük zaferler büyük olanlar kadar önemlidir. Bu ivmeyi koru.","Duyduğuma sevindim. İyi hissetmeyi hak ediyorsun. Devam et!"],
default:["Anlıyorum. Bunun sana neler hissettirdiğini biraz daha anlatabilir misin?","Bunu paylaştığın için teşekkürler — cesaret ister. Ne yaşıyor olursan ol, bir seferde bir gün yeterli.","Senin için buradayım. Bazen sadece kelimelere dökmek bile bir rahatlama türüdür."]}
},
team:{badge:"Kurucular",title:"<em>MindBridge</em>'in Mimarları.",m1role:"Baş Geliştirici ve Kurucu Ortak",m1bio:"MindBridge'in dijital ekosistemini tasarlıyor. Bir yazılım mühendisliği öğrencisi olarak Yiğit, Python ve Java kullanarak temiz ve sağlam backend altyapıları inşa etmeye odaklanıyor. Platformumuzun mantığının mümkün olduğunca yapılandırılmış ve dayanıklı olmasını sağlıyor.",m2role:"Tasarım Başkanı ve Kurucu Ortak",m2bio:"Dijital sağlığa 'sessiz lüks' estetiği getiriyor. Mert, ruh sağlığı araçlarının klinik hissettirmemesi gerektiğine inanıyor. Görsel karmaşa olmadan zihin huzurunu ön planda tutan sezgisel, minimalist ve sakinleştirici arayüzler tasarlıyor.",m3role:"Topluluk ve Strateji Lideri",m3bio:"Platform ile kampüs arasındaki boşluğu kapatıyor. Onur, topluluk erişimini stratejikleştirerek araçlarımızın gerçek dünya etkisine dönüşmesini sağlıyor. Dijital katılımı öğrenciler için gerçek, somut destek ağlarına dönüştürüyor."},

{range:[0,4],emoji:"🌱",bg:"#EAFBF8",col:"#0E6B5F",label:"İyi başa çıkıyor gibisin",desc:"Cevapların şu anda oldukça iyi yönettiğini gösteriyor. Bu her şeyin mükemmel olduğu anlamına gelmez — ama temellerin sağlam görünüyor. Yapabileceğin en iyi şey işe yarayanı korumak: rutinleri sürdür, sosyal bağlantıları koru ve düzenli olarak kendinle kontrol et.",recs:[{t:"Tutarlı kal",d:"Küçük günlük alışkanlıklar birikir. Uyku, hareket ve düzenli öğünler herhangi bir tek müdahaleden daha önemlidir."},{t:"Başkaları için bir kaynak ol",d:"İyi bir durumdaysan, akran elçisi programını veya #study-together'a katılmayı düşün."},{t:"Nazikçe izle",d:"Özellikle yoğun baskı dönemlerinde birkaç hafta sonra bu kontrolü tekrarla."},{t:"Akran hikayelerini keşfet",d:"Hikayeleri oku — ihtiyacın olduğu için değil, başkalarını anlamak empati oluşturduğu için."}]},
{range:[5,9],emoji:"🌤",bg:"#FFFBEB",col:"#92400E",label:"Orta düzey stres — ele alınmaya değer",desc:"Cevapların orta düzeyde stres, yorgunluk veya sosyal kopukluk gösteriyor. Bu üniversite öğrencileri arasında çok yaygın — ama 'yaygın' zorlanarak ilerlemen gerektiği anlamına gelmez. Ele alınmayan orta düzey stres birikme eğilimindedir. Nispeten küçük ayarlamalar şimdi anlamlı bir fark yaratabilir.",recs:[{t:"Toplulukla bağlantı kur",d:"MindBridge Discord'una katıl — özellikle #study-together veya #general-chat'e. Sadece orada olmak bile yardımcı olur."},{t:"Biriyle konuş",d:"Güvendiğin bir arkadaş, bir akran elçisi veya bir danışman. Konuşmaktan fayda görmek için kriz durumunda olmana gerek yok."},{t:"Tek bir mikro-alışkanlık",d:"10 dakikalık bir yürüyüş, tutarlı bir uyku saati veya ekrandan uzak bir öğün. Birini seç ve bir hafta boyunca tekrarla."},{t:"Seçeneklerini bil",d:"Aciliyeti olmadan önce üniversite danışmanlık hizmetini şimdi araştır — bariyeri düşürmek için."}]},
{range:[10,15],emoji:"🌧",bg:"#FFF0F0",col:"#991B1B",label:"Yüksek stres — lütfen bekleme",desc:"Cevapların şu anda önemli düzeyde stres, tükenmişlik veya sıkıntı taşıdığını gösteriyor. Bu düzeydeki gerginlik uykuyu, konsantrasyonu, ilişkileri ve çalışma yeteneğini etkiler. Ele alınmazsa kendini güçlendirebilir. Desteği hak ediyorsun — işler kötüleştiğinde değil, tam olarak şimdi.",recs:[{t:"Bir danışmanlık randevusu al",d:"Bugün üniversite danışmanlık hizmetleriyle iletişime geç. 'Yeterince ciddi' bir nedene ihtiyacın yok. Zorlanmak yeterli."},{t:"Danışman hocanla konuş",d:"Bilmediğin akademik düzenlemeleri, uzatmaları veya yönlendirmeleri işaretleyebilirler."},{t:"Bugün biriyle konuş",d:"Bir arkadaş, aile üyesi veya MindBridge akran elçisi. Bunu tek başına yönetmek zorunda değilsin."},{t:"Kriz kaynakları mevcut",d:"Eğer işler acil hissettiriyorsa, 116 123'ü (TelefonSeelsorge, 7/24, ücretsiz) ara ya da bu sitedeki ! butonunu kullan."}]}
