stories_data:[
{tag:"stress transition",n:"01",badges:[{t:"Sınav stresi",bg:"#FEF3C7",c:"#92400E"},{t:"Birinci sınıf",bg:"#E0F2FE",c:"#075985"}],year:"2024",title:"“Herkesin işi çözdüğünü sandım. Dağılan tek kişi bendim.”",excerpt:"İlk sınav döneminde art arda üç gece uyuyamadım. Sonuçlar açıklanmadan önce bile her şeyi geçemediğime ikna olmuş bir şekilde üniversite portalını sürekli yeniliyordum...",full:["İlk sınav döneminde art arda üç gece uyuyamadım. Sonuçlar açıklanmadan önce bile her şeyi geçemediğime ikna olmuş bir şekilde üniversite portalını sürekli yeniliyordum. Seminerlerde tamamen sessiz kalırdım, konuşursam insanların oraya ait olmadığımı fark edeceğinden korkardım. Annemi bir kez aradım ama ne diyeceğimi bilemediğim için o açmadan kapattım.","Yurdumdan biri sınav kaygısı hakkında bir MindBridge Instagram hikayesi paylaştı. Üç kez okudum. Tam olarak hissettiğimi anlatıyordu — bir kriz olarak değil, gerçek ve paylaşılan bir şey olarak. Belki de bozuk olmadığımı düşündüğüm ilk andı. Öz-değerlendirme aracını kullandım, danışmanlık ofisine ulaşmamı önerdi. O öğleden sonra randevu aldım. Altı hafta sonra bunu atlattım.","Keşke birisi bana daha önce şunu söyleseydi: birinci sınıfta zorlanmak yanlış seçim yaptığın anlamına gelmez. İnsan olduğun anlamına gelir."],outcome:"Danışmanlık programını tamamladı, şimdi bir akran elçisi"},
{tag:"social identity",n:"02",badges:[{t:"Kimlik",bg:"#F3E8FF",c:"#6B21A8"},{t:"Uluslararası öğrenci",bg:"#FCE7F3",c:"#9D174D"}],year:"2024",title:"“Bir derece için ülke değiştirmenin kendini kaybetmek gibi hissettirebileceği konusunda kimse beni uyarmadı.”",excerpt:"Burada okumak için taşındım ve iki ay içinde ev arkadaşlarımın çoğuyla konuşmayı bıraktım — kaba oldukları için değil, her etkileşim hazırlıksız olduğum bir performans gibi hissettirdiği için...",full:["Burada okumak için taşındım ve iki ay içinde ev arkadaşlarımın çoğuyla konuşmayı bıraktım — kaba oldukları için değil, her etkileşim hazırlıksız olduğum bir performans gibi hissettirdiği için. Dilim iyiydi, ama mizah, zamanlama, kültürel referanslar — her şey biraz yanlış hissettiriyordu. Yalnız yemek yemeye ve aileme hayatımın en güzel zamanını geçirdiğimi söylemeye başladım.","MindBridge Discord'unu bir Reddit gönderisi üzerinden buldum. Özellikle uluslararası öğrenciler için bir kanal vardı. İki hafta boyunca hiçbir şey yazmadım — sadece okudum. Sonra biri gece 2'de kampüste görünmez hissettiğini yazdı ve on iki kişi bir saat içinde yanıt verdi. İlk kez bir şey yazdım. Kendi bölgemden biri yanıt verdi.","Yalnızlık bir gecede kaybolmadı. Ama performans yapmayı bıraktım. Uyum sağlamak ve ait olmanın çok farklı iki şey olduğunu öğrenmeye başladım — sadece biri peşinden koşmaya değer."],outcome:"Discord'da uluslararası öğrenci haftalık oturumuna birlikte moderatörlük yapıyor"},
{tag:"burnout stress",n:"03",badges:[{t:"Tükenmişlik",bg:"#FEF2F2",c:"#991B1B"},{t:"Yüksek lisans öğrencisi",bg:"#F0FDF4",c:"#166534"}],year:"2023",title:"“Her son teslim tarihini yakalıyordum ama gerçekten önemli olan her şeyde başarısız oluyordum.”",excerpt:"Yüksek lisansımın ikinci yılı. Her şeyi zamanında teslim ediyor, iyi notlar alıyordum. Dışarıdan iyiydim. İçeriden hiçbir şey hissetmeyi bırakmıştım...",full:["Yüksek lisansımın ikinci yılı. Her şeyi zamanında teslim ediyor, iyi notlar alıyor, tüm seminerlere katılıyordum. Dışarıdan iyiydim. İçeriden hiçbir şey hissetmeyi tamamen bırakmıştım. Kütüphanede beş saat oturup belki 200 kelime üretiyordum. Arkadaşlarıma cevap vermeyi bıraktım. Sadece dönemi atlatmam gerektiğini söylüyordum kendime.","Bir MindBridge TikTok'u akademik tükenmişliğin belirtilerini sıralıyordu — düşük motivasyon, duygusal hissizlik, fiziksel bitkinlik. Hepsine sahiptim. Aylardır buna tembellik diyordum. Adını koymak bir şeyi değiştirdi.","Öz-değerlendirme aracı bir son teslim tarihi uzatmasına bakmamı önerdi. Resmi bir doktor raporu olmadan uzatmaların var olduğunu bilmiyordum. Başvurdum. Bölümüm tamamen anlayışlıydı. Yedi hafta sonra derecemi tamamladım.","Sistemin kimsenin söylediğinden daha fazla esnekliği var. MindBridge bana sormamı söyledi."],outcome:"Yüksek lisans derecesini tamamladı. İçerik ekibinde gönüllü çalışıyor"},
{tag:"social transition",n:"04",badges:[{t:"Sosyal izolasyon",bg:"#E0F2FE",c:"#075985"},{t:"2. sınıf",bg:"#FEF3C7",c:"#92400E"}],year:"2024",title:"“İkinci sınıf birinci sınıftan daha zordu. Kimse beni ikinci sınıf düşüşü konusunda uyarmadı.”",excerpt:"Birinci sınıfta yerleşik bir sosyal yapı vardı: ev arkadaşları, hazırlık etkinlikleri, düzenli kaos. İkinci sınıfta bir kez tanıştığım insanlarla bir eve taşındım. Kampüs derslerin arasında boşaldı...",full:["Birinci sınıfta yerleşik bir sosyal yapı vardı: ev arkadaşları, hazırlık etkinlikleri, düzenli kaos. İkinci sınıfta bir kez tanıştığım insanlarla bir eve taşındım. Kampüs derslerin arasında boşaldı. Daha fazla bağımsızlığım vardı ve bununla yapacak daha az şeyim vardı. Bütün hafta sonlarını yüz yüze kimseyle konuşmadan geçirmeye başladım.","MindBridge Discord'una çoğunlukla oyalanmak için katıldım. #study-together kanalında gerçek zamanlı çalışan insanlar vardı — video yok, baskı yok, sadece zaman damgaları ve kontroller. Her sabah katılmaya başladım. Bir ay içinde başkalarının ritimleri etrafında gevşek bir rutinim oldu. Kulağa küçük geliyor. Muazzam yardımcı oldu.","İhtiyacım olan terapi ya da müdahale değildi — yapı ve varlıktı. Topluluk bana bunu verdi."],outcome:"Şimdi haftalık #study-together birlikte çalışma oturumlarını organize ediyor"},
{tag:"identity burnout",n:"05",badges:[{t:"Kimlik",bg:"#F3E8FF",c:"#6B21A8"},{t:"Tükenmişlik",bg:"#FEF2F2",c:"#991B1B"}],year:"2024",title:"“Artık inanmadığım bir şeyi okuyordum. Bunu kabul etmek başarısızlık gibi hissettirdi.”",excerpt:"İkinci sınıfın ortasında yanlış bölümü seçtiğimi fark ettim — yanlış üniversiteyi değil, yanlış konuyu. Bölüm değiştirmek herkesin zamanını boşa harcadığımı kabul etmek gibi hissettirdi...",full:["İkinci sınıfın ortasında yanlış bölümü seçtiğimi fark ettim — yanlış üniversiteyi değil, yanlış konuyu. Okuduğum her şey gerçekten istediğimden kopuk hissettiriyordu. Ama bunu söyleyemiyordum. Bölüm değiştirmek herkesin zamanını ve parasını boşa harcadığımı kabul etmek gibi hissettirdi.","Derslere gitmemeye başladım. Sonra öğretimlere. Devam oranı yaklaşık %40'a düştü. Aileme her şeyin yolunda olduğunu söyledim. İçeride suçluluk, sıkıntı ve korku arasında gidip gelen sürekli düşük düzeyli bir panik içindeydim.","Bir MindBridge Instagram gönderisi şunu sordu: “Çalışmalarınla mı zorlanıyorsun, yoksa yönle mi?” Ekran görüntüsü aldım ve bir hafta boyunca ona baktım. Sonra bir akademik danışmanla randevu aldım. Düşündüğümden daha fazla seçenek vardı. Bir sonraki dönem bölüm değiştirdim.","Şimdi gerçekten istediğim şeyi okuyorum. Devam oranım %94. Fikrini değiştirmek başarısızlık değildir. Senin için yanlış olan bir yerde kalmak çok daha zor bir yoldur."],outcome:"Bölüm değişikliğini başarıyla tamamladı. Yeni bölümde %94 devam"},
{tag:"stress social",n:"06",badges:[{t:"Mali stres",bg:"#FEF3C7",c:"#92400E"},{t:"Yarı zamanlı öğrenci",bg:"#F0FDF4",c:"#166534"}],year:"2023",title:"“Haftada 25 saat çalışıyordum ve bunun normal olduğunu iddia ediyordum. Değildi.”",excerpt:"Derecemin çoğunu kendim ödedim. Bu, haftada iki gün asgari ücretle çalışmak ve diğer beş günde tam zamanlı bir öğrenci gibi davranmaya çalışmak anlamına geliyordu. Her zaman gerideydim, her zaman özür diliyordum...",full:["Derecemin çoğunu kendim ödedim — haftada iki gün çalışıyor, diğer beş günde tam zamanlı bir öğrenci gibi davranmaya çalışıyordum. Her zaman gerideydim, yorgun olduğum için her zaman özür diliyordum, okumaları iki kez yapacak zamanı olan sınıf arkadaşlarımla kendimi sürekli karşılaştırıyordum.","Stres sadece akademik değildi — bunun utancıydı. Mali olarak zorlandığımı gizlemem gerektiği hissiydi. Bunun beni daha az ciddi gösterdiğini düşündüğüm için bunun hakkında konuşmadım.","Bir MindBridge bültininde mali refah ve ekonomik baskının ruh sağlığı üzerindeki etkisi hakkında bir sayı vardı. Var olduğunu bilmediğim zorluk fonlarını, bursları ve gıda bankası erişimini listeliyordu. İki fona başvurdum. Birini aldım. Bir aylık kirayı karşıladı.","Mali stres ve ruh sağlığı ayrı konuşmalar değil. MindBridge'in bunları bağlantılı olarak ele almasına sevindim."],outcome:"Zorluk bursu aldı. Şimdi bülten editör ekibine danışmanlık yapıyor"}
]

ground:{h:"Angst-Erdung",d:"Eine 5-Schritte-Sinnestechnik, die dich in den gegenwärtigen Moment zurückholt.",btn:"Nächster Schritt",again:"Neu starten",steps:[{icon:"👀",text:"Nimm <strong>5 Dinge</strong> wahr, die du gerade um dich herum siehst."},{icon:"✋",text:"Berühre <strong>4 Dinge</strong> in deiner Nähe und spüre, wie sie sich anfühlen."},{icon:"👂",text:"Höre auf <strong>3 Geräusche</strong> in deiner Umgebung gerade jetzt."},{icon:"👃",text:"Nimm <strong>2 Dinge</strong> wahr, die du riechen kannst, oder zwei Gerüche, die du magst."},{icon:"👅",text:"Nimm <strong>1 Ding</strong> wahr, das du schmecken kannst. Du bist zurück im gegenwärtigen Moment."},{icon:"✨",text:"<strong>Erdung abgeschlossen.</strong> Atme einmal lang und langsam. Du bist hier. Du bist sicher."}]},

gratitude:{h:"Mikro-Dankbarkeit",d:"Verändere den negativen Bias deines Gehirns, indem du heute eine kleine positive Sache festhältst.",ph:"z. B. Eine gute Tasse Kaffee...",btn:"Dankbarkeit protokollieren",saved:"Gespeichert!"},
affirm:{h:"Affirmations-Deck",d:"Zieh eine zufällige Affirmationskarte, um deine Denkweise bei Selbstzweifeln neu zu ordnen.",btn:"Neue Karte ziehen",cards:["Ich bin mehr als meine akademische Leistung.","Ich bin fähig, Dinge zu bewältigen, auf die ich nicht vorbereitet war.","Ausruhen ist ein produktiver Teil meines Lernprozesses.","Mein Wert wird nicht durch meine heutige Produktivität bestimmt.","Ich erlaube mir, in meinem eigenen Tempo zu lernen.","Um Hilfe zu bitten ist ein Zeichen von Stärke.","Ich tue mein Bestes, und das ist genug.","Eine einzelne Note bestimmt nicht meine Zukunft.","Ich darf Raum einnehmen.","Fortschritt, nicht Perfektion."]},
break:{h:"Achtsame Pause",d:"Erzeuge eine 2-minütige Offline-Aufgabe, um dich vom Bildschirm zu lösen.",cta:"Klick unten, um eine Aufgabe zu erzeugen.",btn:"Gib mir eine Pause",tasks:["Schau aus dem Fenster und finde 3 grüne Objekte.","Steh auf und strecke deine Arme 15 Sekunden lang nach oben.","Trink jetzt ein großes Glas kaltes Wasser.","Schließ die Augen und konzentrier dich 60 Sekunden auf deinen Atem.","Kreise deine Schultern 5-mal rückwärts, dann 5-mal vorwärts.","Schreib einer Freundin oder einem Freund, mit der/dem du lange nicht gesprochen hast.","Halt einen Gegenstand in der Nähe und untersuche 30 Sekunden lang seine Textur."]},
mood:{h:"Täglicher Check-in",d:"Wie fühlst du dich heute mit deiner Arbeitslast? Tracking baut Selbstwahrnehmung auf.",saved:"Stimmung gespeichert. Danke fürs Einchecken."},
canvas:{h:"Zen-Leinwand",d:"Zeichne beruhigende Wellen. Sieh zu, wie sie sanft verblassen — wie vorübergehende Gedanken."},
planes:{h:"Papierflieger",d:"Eine anonyme Empathie-Wand. Lies eine Notiz von einem Kommilitonen oder falte eine, um jemand anderem den Tag zu erhellen.",catchDefault:"„Fang einen Flieger, um eine Nachricht zu lesen.“",catchBtn:"Einen Flieger fangen ✈️",ph:"Schreib eine aufmunternde Notiz für eine andere Person...",foldBtn:"Falten & werfen 🚀",flew:"Erfolgreich weggeflogen!",messages:["Es wird besser, versprochen. Bleib dran.","Du hast 100 % deiner schlechten Tage überstanden.","Atme tief durch — du machst das gut.","Noten bestimmen nicht deinen Wert als Mensch.","Ich bin stolz auf dich, allein dafür, dass du heute da bist.","Ausruhen ist keine Zeitverschwendung.","Irgendjemand da draußen drückt dir gerade die Daumen.","Es ist okay, nicht alles herausgefunden zu haben.","Du bist genug, genau so wie du bist.","Ein Tag nach dem anderen. Das ist alles."]}
},
library:{badge:"Ressourcen & Orientierung",title:"Wissen ist <em>Unterstützung</em>.",faqHeading:"Häufig gestellte Fragen",resHeading:"Kuratierte Ressourcen zur psychischen Gesundheit",resSub:"Artikel, Podcasts und Leitfäden, geprüft vom psychologischen Fachpersonal der Universität.",zonesHeading:"Ruhezonen auf dem Campus",zonesSub:"Bereiche, die ausschließlich für Stille bestimmt sind. Gruppenarbeit ist nicht erlaubt.",
faq:[{q:"Wie buche ich eine*n Universitätsberater*in?",a:"Du kannst ein Erstgespräch über das Online-Studierendenportal unter „Wellbeing Services“ buchen. Die typische Wartezeit beträgt derzeit 1–2 Wochen für Nicht-Notfälle. Termine für den gleichen Tag sind bei Bedarf meist verfügbar."},{q:"Beeinflusst ein Beratungsgespräch meine akademischen Unterlagen?",a:"Auf keinen Fall. Aufzeichnungen zur psychischen Gesundheit sind vollständig vertraulich und physisch sowie digital von deinen akademischen Unterlagen getrennt. Deine Dozierenden werden nie ohne deine ausdrückliche Zustimmung informiert."},{q:"Was ist eine Fristverlängerung wegen Burnout?",a:"Wenn du unter schwerem Burnout leidest, kannst du „Mildernde Umstände“ beantragen, die eine 7-tägige Verlängerung ohne ärztliches Attest für deinen ersten Antrag gewähren. Sprich mit deiner Tutor*in oder dem Studierendenwerk."},{q:"Wie kann ich dem MindBridge-Discord beitreten?",a:"Der Discord steht allen eingeschriebenen Studierenden offen. Schau in unserer Instagram-Bio (@mindbridge.eu) nach dem wöchentlich wechselnden sicheren Einladungslink, um Spam vorzubeugen."},{q:"Ich befinde mich nicht in einer Krise — ist Beratung trotzdem etwas für mich?",a:"Ja. Du musst dich nicht in einer Krise befinden, um von Beratung zu profitieren. Viele Studierende finden sie hilfreich bei allgemeinem Stress, Orientierung, Beziehungen oder akademischem Selbstvertrauen. Denk daran wie an Physiotherapie — du wartest nicht, bis du zerbrochen bist."},{q:"Gibt es finanzielle Unterstützungsmöglichkeiten für Studierende?",a:"Ja. Die meisten Universitäten bieten Härtefallfonds, Nothilfestipendien und Zugang zu Lebensmittelbanken, die nicht weit beworben werden. Wende dich an das Studierendenwerk oder die Studierendenvertretung, um zu erfahren, was verfügbar ist. Finanzieller Stress wirkt sich direkt auf die psychische Gesundheit aus — beides sind gültige Gründe, sich zu melden."}],faq:[{q:"Wo finde ich Unterstützung?",a:"Informiere dich auf der offiziellen Website deiner Hochschule über Beratungs- und Studierendenangebote. Verfügbarkeit, Kosten, Vertraulichkeit und Wartezeiten unterscheiden sich je nach Einrichtung."},{q:"Ist MindBridge ein klinischer Dienst?",a:"Nein. MindBridge ist eine Demo für studentisches Wohlbefinden und bietet keine Diagnose, Behandlung oder Notfallversorgung."},{q:"Was soll ich in einem Notfall in Deutschland tun?",a:"Bei unmittelbarer Gefahr ruf 112 an. Vertrauliche emotionale Unterstützung bietet die TelefonSeelsorge unter 116 123."}],
libcards:[{tag:"Artikel",h:"Hochstapler-Syndrom im Studium",d:"Erkenne und überwinde das Gefühl, nicht dazuzugehören. Du hast dir deinen Platz verdient."},{tag:"Podcast",h:"Der achtsame Studierende, Folge 12",d:"20 Minuten darüber, das soziale Leben mit intensiven Prüfungsphasen auszubalancieren, ohne auszubrennen."},{tag:"PDF-Leitfaden",h:"Schlafhygiene-Protokoll",d:"Schritt-für-Schritt-Anleitung zur Rücksetzung deines circadianen Rhythmus nach durchgemachten Nächten."},{tag:"Video",h:"Erdungstechniken 101",d:"Eine visuelle Demonstration der 5-4-3-2-1-Bewältigungstechnik bei akuter Angst."}],
zones:[{icon:"📚",h:"Bibliothek Südflügel (4. Stock)",d:"Strikt still. Hervorragendes Tageslicht. Nur Einzelarbeit.",c:"var(--g)"},{icon:"🌳",h:"Botanisches Atrium",d:"Hinter dem Naturwissenschaftsgebäude. Grünpflanzen im Innenbereich, sehr wenig Publikumsverkehr.",c:"var(--blue)"},{icon:"🛋️",h:"Wellbeing-Lounge",d:"Studierendenvertretung, Raum 204. Sofas, gedimmtes Licht, keine Laptops.",c:"var(--amber)"}]
},
chat:{badge:"KI-Support-Begleiter",title:"Ein sicherer Ort, um dich <em>auszusprechen</em>.",sub:"Unser smarter KI-Begleiter bietet maßgeschneiderte Bewältigungsstrategien. Kein Ersatz für professionelle Therapie — aber rund um die Uhr zum Zuhören da.",ph:"Schreib deine Nachricht hier...",send:"Senden",greetingMsg:"Hallo! Ich bin der MindBridge-KI-Begleiter. Das ist ein sicherer, urteilsfreier Raum. Wie fühlst du dich heute?",
R:{greeting:["Hallo! Ich bin hier, um zuzuhören — das ist ein sicherer Ort. Wie läuft's?","Hi. Was auch immer du fühlst, du musst es nicht allein tragen. Was beschäftigt dich?"],
stress:["Akademischer Druck kann sich unmöglich schwer anfühlen. Versuch, eine Aufgabe in den kleinstmöglichen Schritt zu zerlegen — nur den nächsten. Hast du unseren Fokus-Hub schon ausprobiert?","Prüfungen und Fristen sind stressig, aber deine Noten bestimmen nicht deinen Wert. Was fühlt sich gerade am überwältigendsten an?","Klingt, als hättest du viel um die Ohren. Die 4-7-8-Atemübung kann dein Nervensystem in unter 5 Minuten zurücksetzen."],
sadness:["Es tut mir wirklich leid, dass du dich so fühlst — es braucht Mut, das in Worte zu fassen. Du bist damit nicht allein.","Das klingt wirklich schwer. Deine Gefühle sind völlig berechtigt. Falls es hilft, unsere Campus-Berater*innen stehen zur Verfügung und es ist kostenlos.","Ich höre dich. Traurigkeit zu tragen ist erschöpfend. Ich bin hier, um zuzuhören, solange du brauchst."],
burnout:["Burnout ist dein Körper, der um eine Pause bittet. Ausruhen ist keine Faulheit — es gehört zum guten Funktionieren dazu. Kannst du dir heute Abend wenigstens eine Stunde freihalten?","Du kämpfst schon lange hart. Probier den Achtsame-Pause-Generator für einen 2-minütigen Bildschirm-Reset. Kleine Pausen verhindern große Zusammenbrüche.","Erschöpfung ist real. Achte darauf, Wasser zu trinken und zu essen. Körperliche Grundlagen wirken sich direkt auf den mentalen Zustand aus."],
positive:["Freut mich, das zu hören! Gute Momente zu schützen ist genauso wichtig wie die schweren durchzuarbeiten.","Das ist wunderbar. Kleine Erfolge zählen genauso wie große. Behalte diesen Schwung bei.","Schön zu hören. Du verdienst es, dich gut zu fühlen. Weiter so!"],
default:["Ich verstehe. Kannst du mir etwas mehr darüber erzählen, wie dich das fühlen lässt?","Danke, dass du das teilst — das braucht Mut. Was auch immer du durchmachst, einen Tag nach dem anderen reicht.","Ich bin für dich da. Manchmal ist es schon eine Erleichterung, es einfach in Worte zu fassen."]}
},
team:{badge:"Die Gründer",title:"Architekten von <em>MindBridge</em>.",m1role:"Lead Developer & Mitgründer",m1bio:"Gestaltet das digitale Ökosystem von MindBridge. Als Softwaretechnik-Student konzentriert sich Yiğit darauf, mit Python und Java saubere, robuste Backend-Infrastrukturen zu bauen. Er sorgt dafür, dass die Logik unserer Plattform so strukturiert und widerstandsfähig wie möglich ist.",m2role:"Head of Design & Mitgründer",m2bio:"Bringt eine Ästhetik des „stillen Luxus“ in digitales Wohlbefinden. Mert glaubt, dass sich Werkzeuge für psychische Gesundheit nicht klinisch anfühlen sollten. Er gestaltet intuitive, minimalistische und beruhigende Benutzeroberflächen, die innere Ruhe ohne visuelle Unordnung priorisieren.",m3role:"Leiter Community & Strategie",m3bio:"Schlägt die Brücke zwischen Plattform und Campus. Onur entwickelt die Strategie für die Community-Arbeit und sorgt dafür, dass unsere Werkzeuge reale Wirkung entfalten. Er verwandelt digitales Engagement in echte, greifbare Unterstützungsnetzwerke für Studierende."},
contact:{badge:"Kontakt aufnehmen",title:"Wir sind für<br>dich da.",sub:"Ob du professionelle Unterstützung brauchst, Feedback teilen möchtest oder einfach eine Frage hast — melde dich. Jede Nachricht zählt.",proH:"Krisenhilfe und unmittelbare Unterstützung",proD:"MindBridge ist ein unabhängiges Demo-Projekt und kein klinischer Dienst. Die TelefonSeelsorge bietet in Deutschland kostenlose, vertrauliche Unterstützung unter 116 123. Bei unmittelbarer Gefahr: 112. Informationen zur Campus-Beratung findest du über die offiziellen Kanäle deiner Hochschule.",callBtn:"TelefonSeelsorge anrufen — 116 123",bookBtn:"Offizielle Support-Informationen",bookAlert:"",fbH:"Anonymes Feedback",fbD:"Hast du eine Idee für ein neues Werkzeug? Einen Fehler gefunden? Möchtest du teilen, wie MindBridge dir geholfen hat? In dieser Demo wird kein Feedback übermittelt; zum Empfangen von Nachrichten muss ein Backend verbunden werden.",fbPh:"Deine Nachricht hier...",fbBtn:"Anonym senden",fbSent:"Nachricht sicher gesendet. Danke.",igH:"Auf Instagram folgen",igD:"Social-Media-Links und Community-Aktivitäten sind in dieser Demo nicht verbunden.",dcH:"Tritt unserem Discord bei",dcD:"Community-Funktionen sind für eine zukünftige Version geplant. In dieser Demo ist keine aktive Community und keine Live-Studierendenzahl verbunden.",dcBtn:"Server beitreten →"},
quiz:{eyebrow:"Anonymer Selbsttest",title:"Wie geht es dir <em>wirklich</em>?",sub:"5 Fragen. Unter 2 Minuten. Deine Antworten werden nicht gespeichert oder geteilt. Am Ende erhältst du eine persönliche Einschätzung und konkrete nächste Schritte.",next:"Nächste Frage →",qCounter:"Frage",of:"von",selectPrompt:"Wähle eine Antwort, um fortzufahren",retake:"Wiederholen",exploreTools:"Werkzeuge entdecken →",getSupport:"Unterstützung holen →",
QS:[
{q:"Wie oft hast du dich in den letzten zwei Wochen müde, erschöpft oder energielos gefühlt?",hint:"Denk sowohl an körperliche als auch mentale Energie — nicht nur an die Schlafmenge.",opts:[{l:"Selten oder gar nicht",s:0,d:"Dein Energielevel scheint relativ stabil zu sein."},{l:"An manchen Tagen",s:1,d:"Leichte Müdigkeit, die kommt und geht."},{l:"An mehr Tagen als nicht",s:2,d:"Anhaltend niedrige Energie verdient Aufmerksamkeit."},{l:"Fast jeden Tag",s:3,d:"Dieses Ausmaß an Erschöpfung kann deine Funktionsfähigkeit erheblich beeinträchtigen."}]},
{q:"Wie oft hast du dich in den letzten zwei Wochen nervös, ängstlich oder angespannt gefühlt?",hint:"Schließe leichte Sorgen, rasende Gedanken oder ein allgemeines Unbehagen mit ein.",opts:[{l:"Gar nicht",s:0,d:"Angst scheint gerade kein bedeutender Faktor zu sein."},{l:"Gelegentlich",s:1,d:"Handhabbare, situative Angst."},{l:"Mehrere Tage pro Woche",s:2,d:"Angst, die deinen Alltag beeinflusst."},{l:"Fast ständig",s:3,d:"Hohe Angst, die angemessene Unterstützung verdient."}]},
{q:"Wie verbunden fühlst du dich im letzten Monat mit den Menschen um dich an der Universität?",hint:"Schließt Kommiliton*innen, Mitbewohner*innen, Freund*innen oder alle auf dem Campus ein.",opts:[{l:"Sehr verbunden — ich habe Menschen, auf die ich mich verlassen kann",s:0,d:"Starke soziale Unterstützung ist der schützendste Faktor für psychische Gesundheit."},{l:"Etwas verbunden",s:1,d:"Einige Verbindungen, aber vielleicht nicht so tief, wie du es dir wünschst."},{l:"Ziemlich isoliert",s:2,d:"Soziale Isolation an der Universität ist häufig, sollte aber nicht unbeachtet bleiben."},{l:"Sehr isoliert — ich interagiere selten sinnvoll",s:3,d:"Erhebliche Isolation, die direkt angegangen werden sollte."}]},
{q:"Wie würdest du deine Fähigkeit beschreiben, dich in letzter Zeit auf das Studium oder akademische Arbeit zu konzentrieren?",hint:"Nicht nur, wenn du müde bist — deine allgemeine Fokusfähigkeit, wenn du dich hinsetzt.",opts:[{l:"Gut — ich kann mich konzentrieren, wenn ich muss",s:0,d:"Die Konzentration scheint intakt zu sein."},{l:"Wechselhaft — manche gute, manche schwierige Tage",s:1,d:"Schwankender Fokus ist normal, aber beobachtenswert."},{l:"Schwierig — ich setze mich oft hin und schaffe wenig",s:2,d:"Konzentrationsschwierigkeiten deuten oft auf zugrunde liegenden Stress hin."},{l:"Sehr schwierig — selbst einfache Aufgaben fühlen sich überwältigend an",s:3,d:"Dieses Ausmaß an Schwierigkeit deutet auf eine erhebliche mentale Belastung hin."}]},
{q:"Wenn du eine schwierige Phase durchmachst, was beschreibt deine Reaktion am besten?",hint:"Es gibt keine richtige Antwort — das hilft uns zu verstehen, welche Unterstützung zu dir passen könnte.",opts:[{l:"Ich komme mit meinen eigenen Strategien zurecht",s:0,d:"Gute Selbstregulationsfähigkeiten vorhanden."},{l:"Ich wende mich an Menschen, denen ich vertraue",s:1,d:"Soziale Bewältigung ist eine echte Stärke."},{l:"Ich ziehe mich zurück und komme allein damit klar",s:2,d:"Alleiniges Bewältigen kann kurzfristig funktionieren, hat aber Grenzen."},{l:"Ich fühle mich festgefahren und kann nichts unternehmen",s:3,d:"Sich eingefroren zu fühlen ist ein Signal, das ernst genommen werden sollte."}]}
],
RESULTS:[
{range:[0,4],emoji:"🌱",bg:"#EAFBF8",col:"#0E6B5F",label:"Du scheinst gut zurechtzukommen",desc:"Deine Antworten deuten darauf hin, dass es dir gerade ziemlich gut geht. Das heißt nicht, dass alles perfekt ist — aber deine Grundlagen scheinen solide zu sein. Das Beste, was du tun kannst, ist zu schützen, was funktioniert: Routinen beibehalten, soziale Verbindungen pflegen und regelmäßig bei dir selbst nachfragen.",recs:[{t:"Bleib konsequent",d:"Kleine tägliche Gewohnheiten summieren sich. Schlaf, Bewegung und regelmäßige Mahlzeiten sind wichtiger als jede einzelne Maßnahme."},{t:"Sei eine Ressource für andere",d:"Wenn es dir gut geht, überlege dir das Peer-Botschafter-Programm oder tritt #study-together bei."},{t:"Behalte es sanft im Blick",d:"Wiederhole diesen Check-in in ein paar Wochen, besonders in Phasen mit hohem Druck."},{t:"Entdecke Erfahrungsberichte",d:"Lies die Geschichten — nicht weil du musst, sondern weil das Verständnis für andere Empathie aufbaut."}]},
{range:[5,9],emoji:"🌤",bg:"#FFFBEB",col:"#92400E",label:"Mäßiger Stress — es lohnt sich, ihn anzugehen",desc:"Deine Antworten deuten auf ein moderates Maß an Stress, Erschöpfung oder sozialer Distanzierung hin. Das ist unter Studierenden sehr verbreitet — aber „verbreitet“ heißt nicht, dass du dich einfach durchkämpfen solltest. Unbehandelter mäßiger Stress neigt dazu, sich anzusammeln. Relativ kleine Anpassungen können jetzt einen bedeutenden Unterschied machen.",recs:[{t:"Verbinde dich mit der Community",d:"Tritt dem MindBridge-Discord bei — besonders #study-together oder #general-chat. Schon die bloße Anwesenheit hilft."},{t:"Sprich mit jemandem",d:"Eine vertraute Person, ein*e Peer-Botschafter*in oder eine Beratungsperson. Du musst nicht in einer Krise sein, um vom Reden zu profitieren."},{t:"Eine Mikro-Gewohnheit",d:"Ein 10-minütiger Spaziergang, eine feste Schlafenszeit oder eine Mahlzeit ohne Bildschirm. Wähle eine und wiederhole sie eine Woche lang."},{t:"Kenne deine Möglichkeiten",d:"Informiere dich jetzt über die universitäre Beratungsstelle — bevor du sie dringend brauchst — um die Hürde zu senken."}]},
{range:[10,15],emoji:"🌧",bg:"#FFF0F0",col:"#991B1B",label:"Hoher Stress — bitte warte nicht",desc:"Deine Antworten deuten darauf hin, dass du gerade erheblichen Stress, Erschöpfung oder Leid trägst. Dieses Ausmaß an Belastung beeinträchtigt Schlaf, Konzentration, Beziehungen und deine Fähigkeit zu studieren. Es kann sich selbst verstärken, wenn es nicht angegangen wird. Du verdienst Unterstützung — nicht erst, wenn es schlimmer wird, sondern genau jetzt.",recs:[{t:"Vereinbare einen Beratungstermin",d:"Kontaktiere noch heute die universitäre Beratungsstelle. Du brauchst keinen „ernst genug“ klingenden Grund. Zu kämpfen ist Grund genug."},{t:"Sprich mit deiner Tutor*in",d:"Sie können akademische Anpassungen, Fristverlängerungen oder Weiterverweisungen aufzeigen, die du vielleicht nicht kennst."},{t:"Sprich heute mit jemandem",d:"Eine Freundin, ein Familienmitglied oder ein*e MindBridge-Peer-Botschafter*in. Du musst das nicht allein bewältigen."},{t:"Krisen-Ressourcen verfügbar",d:"Wenn sich die Lage dringend anfühlt, ruf 116 123 an (TelefonSeelsorge, 24/7, kostenlos) oder nutze den !-Button auf dieser Seite."}]}
]},
footer:{tagline:"Eine von Studierenden geleitete Kommunikationskampagne für psychische Gesundheit. Von Studierenden, für Studierende gemacht.",follow:"@mindbridge.eu folgen",credit:"© 2026 MindBridge."},
stories_data:[
{tag:"stress transition",n:"01",badges:[{t:"Prüfungsstress",bg:"#FEF3C7",c:"#92400E"},{t:"Erstes Jahr",bg:"#E0F2FE",c:"#075985"}],year:"2024",title:"„Ich dachte, alle anderen hätten es im Griff. Ich war die Einzige, die zerbrach.“",excerpt:"Während meiner ersten Prüfungsphase konnte ich drei Nächte hintereinander nicht schlafen. Ich aktualisierte ständig das Uniportal, überzeugt, alles vermasselt zu haben, noch bevor die Ergebnisse überhaupt veröffentlicht wurden...",full:["Während meiner ersten Prüfungsphase konnte ich drei Nächte hintereinander nicht schlafen. Ich aktualisierte ständig das Uniportal, überzeugt, alles vermasselt zu haben, noch bevor die Ergebnisse überhaupt veröffentlicht wurden. In Seminaren wurde ich völlig still, aus Angst, dass die Leute merken würden, dass ich nicht dazugehöre, wenn ich spräche. Ich rief einmal meine Mutter an, legte aber auf, bevor sie abhob, weil ich nicht wusste, was ich sagen sollte.","Jemand in meinem Wohnheim postete eine MindBridge-Instagram-Story über Prüfungsangst. Ich las sie dreimal. Sie beschrieb genau, was ich fühlte — nicht als Krise, sondern als etwas Reales und Geteiltes. Das war das erste Mal, dass ich dachte, vielleicht bin ich nicht kaputt. Ich nutzte den Selbsttest, der mir vorschlug, mich an die Beratungsstelle zu wenden. Ich vereinbarte noch am selben Nachmittag einen Termin. Sechs Wochen später hatte ich es geschafft.","Was ich mir wünschte, jemand hätte es mir früher gesagt: Im ersten Jahr zu kämpfen bedeutet nicht, die falsche Wahl getroffen zu haben. Es bedeutet, dass man ein Mensch ist."],outcome:"Beratungsprogramm abgeschlossen, jetzt Peer-Botschafterin"},
{tag:"social identity",n:"02",badges:[{t:"Identität",bg:"#F3E8FF",c:"#6B21A8"},{t:"Internationale Studierende",bg:"#FCE7F3",c:"#9D174D"}],year:"2024",title:"„Niemand hat mich gewarnt, dass ein Länderwechsel für ein Studium sich anfühlen kann, als würde man sich selbst verlieren.“",excerpt:"Ich bin für mein Studium hierher gezogen und hatte innerhalb von zwei Monaten aufgehört, mit den meisten meiner Mitbewohner*innen zu sprechen — nicht weil sie unfreundlich waren, sondern weil sich jede Interaktion wie eine Vorstellung anfühlte, auf die ich nicht vorbereitet war...",full:["Ich bin für mein Studium hierher gezogen und hatte innerhalb von zwei Monaten aufgehört, mit den meisten meiner Mitbewohner*innen zu sprechen — nicht weil sie unfreundlich waren, sondern weil sich jede Interaktion wie eine Vorstellung anfühlte, auf die ich nicht vorbereitet war. Meine Sprache war in Ordnung, aber Humor, Timing, kulturelle Bezüge — alles fühlte sich leicht daneben an. Ich fing an, allein zu essen, und erzählte meiner Familie, ich hätte die beste Zeit meines Lebens.","Ich fand den MindBridge-Discord über einen Reddit-Post. Es gab einen Kanal speziell für internationale Studierende. Zwei Wochen lang schrieb ich nichts — ich las nur. Dann postete jemand um 2 Uhr nachts, dass er sich auf dem Campus unsichtbar fühlte, und zwölf Leute antworteten innerhalb einer Stunde. Ich schrieb zum ersten Mal etwas. Jemand aus meiner Heimatregion antwortete.","Die Einsamkeit verschwand nicht über Nacht. Aber ich hörte auf, eine Rolle zu spielen. Ich begann zu lernen, dass Anpassung und Zugehörigkeit zwei sehr unterschiedliche Dinge sind — nur eines davon lohnt sich zu verfolgen."],outcome:"Moderiert die wöchentliche Session für internationale Studierende im Discord mit"},
{tag:"burnout stress",n:"03",badges:[{t:"Burnout",bg:"#FEF2F2",c:"#991B1B"},{t:"Masterstudierende",bg:"#F0FDF4",c:"#166534"}],year:"2023",title:"„Ich hielt jede Frist ein und versagte bei allem, was wirklich zählte.“",excerpt:"Zweites Jahr meines Masters. Ich reichte alles pünktlich ein, bekam anständige Noten. Nach außen war ich in Ordnung. Innerlich fühlte ich überhaupt nichts mehr...",full:["Zweites Jahr meines Masters. Reichte alles pünktlich ein, bekam anständige Noten, besuchte alle Seminare. Nach außen war ich in Ordnung. Innerlich fühlte ich überhaupt nichts mehr. Ich saß fünf Stunden in der Bibliothek und produzierte vielleicht 200 Wörter. Ich hörte auf, Freund*innen zu antworten. Ich redete mir ein, ich müsse nur das Semester durchstehen.","Ein MindBridge-TikTok listete die Anzeichen von akademischem Burnout auf — geringe Motivation, emotionale Taubheit, körperliche Erschöpfung. Ich hatte jedes einzelne davon. Ich hatte es monatelang Faulheit genannt. Es zu benennen, veränderte etwas.","Der Selbsttest schlug mir vor, eine Fristverlängerung in Betracht zu ziehen. Ich wusste nicht, dass es Verlängerungen ohne formales ärztliches Attest gab. Ich beantragte es. Meine Fakultät war äußerst verständnisvoll. Sieben Wochen später schloss ich das Studium ab.","Das System hat mehr Flexibilität, als einem jemand erzählt. MindBridge sagte mir, ich solle fragen."],outcome:"Masterabschluss erreicht. Engagiert sich freiwillig im Content-Team"},
{tag:"social transition",n:"04",badges:[{t:"Soziale Isolation",bg:"#E0F2FE",c:"#075985"},{t:"2. Jahr",bg:"#FEF3C7",c:"#92400E"}],year:"2024",title:"„Das zweite Jahr war härter als das erste. Niemand hat mich vor dem Zweitjahres-Tief gewarnt.“",excerpt:"Das erste Jahr hatte eine eingebaute soziale Struktur: Mitbewohner*innen, Erstsemesterveranstaltungen, organisiertes Chaos. Im zweiten Jahr zog ich in ein Haus mit Leuten, die ich einmal getroffen hatte. Der Campus leerte sich zwischen den Vorlesungen...",full:["Das erste Jahr hatte eine eingebaute soziale Struktur: Mitbewohner*innen, Erstsemesterveranstaltungen, organisiertes Chaos. Im zweiten Jahr zog ich in ein Haus mit Leuten, die ich einmal getroffen hatte. Der Campus leerte sich zwischen den Vorlesungen. Ich hatte mehr Unabhängigkeit und weniger damit anzufangen. Ich verbrachte ganze Wochenenden, ohne mit jemandem persönlich zu sprechen.","Ich trat dem MindBridge-Discord meist bei, um zu prokrastinieren. Der Kanal #study-together hatte Leute, die in Echtzeit arbeiteten — kein Video, kein Druck, nur Zeitstempel und Check-ins. Ich fing an, jeden Morgen mitzumachen. Innerhalb eines Monats hatte ich eine lockere Routine, aufgebaut um die Rhythmen anderer Leute. Klingt klein. Es half enorm.","Was ich brauchte, war keine Therapie oder Intervention — es war Struktur und Präsenz. Die Community gab mir das."],outcome:"Organisiert jetzt wöchentliche #study-together-Co-Working-Sessions"},
{tag:"identity burnout",n:"05",badges:[{t:"Identität",bg:"#F3E8FF",c:"#6B21A8"},{t:"Burnout",bg:"#FEF2F2",c:"#991B1B"}],year:"2024",title:"„Ich studierte etwas, an das ich nicht mehr glaubte. Das zuzugeben fühlte sich wie Versagen an.“",excerpt:"Mitten im zweiten Jahr merkte ich, dass ich das falsche Studienfach gewählt hatte — nicht die falsche Universität, das falsche Fach. Den Studiengang zu wechseln fühlte sich an, als würde ich zugeben, die Zeit aller verschwendet zu haben...",full:["Mitten im zweiten Jahr merkte ich, dass ich das falsche Studienfach gewählt hatte — nicht die falsche Universität, das falsche Fach. Alles, was ich studierte, fühlte sich losgelöst von dem an, was ich wirklich wollte. Aber ich konnte das nicht sagen. Den Studiengang zu wechseln fühlte sich an, als würde ich zugeben, die Zeit und das Geld aller verschwendet zu haben.","Ich fing an, Vorlesungen zu schwänzen. Dann Tutorien. Die Anwesenheit sank auf etwa 40 %. Ich sagte meinen Eltern, alles sei in Ordnung. Innerlich befand ich mich in einer ständigen leichten Panik, die zwischen Schuld, Langeweile und Angst hin- und herwechselte.","Ein MindBridge-Instagram-Post fragte: „Kämpfst du mit deinem Studium oder mit der Richtung?“ Ich machte einen Screenshot und sah ihn mir eine Woche lang an. Dann vereinbarte ich einen Termin bei einer akademischen Beratung. Es gab mehr Optionen, als ich dachte. Ich wechselte im folgenden Semester den Studiengang.","Ich studiere jetzt, was ich wirklich wollte. Meine Anwesenheit liegt bei 94 %. Seine Meinung zu ändern ist kein Versagen. An einem für einen falschen Ort zu bleiben, ist ein viel härterer Weg."],outcome:"Studiengang erfolgreich gewechselt. 94 % Anwesenheit im neuen Studiengang"},
{tag:"stress social",n:"06",badges:[{t:"Finanzieller Stress",bg:"#FEF3C7",c:"#92400E"},{t:"Teilzeitstudierende",bg:"#F0FDF4",c:"#166534"}],year:"2023",title:"„Ich arbeitete 25 Stunden pro Woche und tat so, als wäre das normal. War es nicht.“",excerpt:"Ich habe den größten Teil meines Studiums selbst bezahlt. Das bedeutete, zwei Tage die Woche zum Mindestlohn zu arbeiten und die anderen fünf so zu tun, als wäre ich Vollzeitstudentin. Ich war immer im Rückstand, entschuldigte mich immer...",full:["Ich habe den größten Teil meines Studiums selbst bezahlt — arbeitete zwei Tage die Woche und versuchte, die anderen fünf Tage wie eine Vollzeitstudentin zu wirken. Ich war immer im Rückstand, entschuldigte mich immer dafür, müde zu sein, verglich mich ständig mit Kommiliton*innen, die Zeit hatten, die Lektüre zweimal zu machen.","Der Stress war nicht nur akademisch — es war die Scham darüber. Das Gefühl, verbergen zu müssen, dass ich finanziell kämpfte. Ich sprach nicht darüber, weil ich dachte, es würde mich weniger seriös wirken lassen.","Ein MindBridge-Newsletter hatte eine Ausgabe über finanzielles Wohlbefinden und die Auswirkungen wirtschaftlichen Drucks auf die psychische Gesundheit. Er listete Härtefallfonds, Stipendien und den Zugang zu Lebensmittelbanken auf, von denen ich nichts wusste. Ich beantragte zwei Fonds. Ich erhielt einen. Er deckte einen Monat Miete.","Finanzieller Stress und psychische Gesundheit sind keine getrennten Themen. Ich bin froh, dass MindBridge sie als verbunden behandelt."],outcome:"Härtefallstipendium erhalten. Berät jetzt das Redaktionsteam des Newsletters"}
]

affirm:{h:"Mazo de Afirmaciones",d:"Saca una carta de afirmación al azar para replantear tu mentalidad cuando llegue la duda.",btn:"Sacar Nueva Carta",cards:["Soy más que mi rendimiento académico.","Soy capaz de manejar cosas para las que no me preparé.","Descansar es una parte productiva de mi proceso de aprendizaje.","Mi valor no está definido por mi productividad de hoy.","Me doy permiso para aprender a mi propio ritmo.","Pedir ayuda es una señal de fortaleza.","Estoy haciendo lo mejor que puedo, y eso es suficiente.","Una sola nota no determina mi futuro.","Tengo permiso para ocupar espacio.","Progreso, no perfección."]},

planes:{h:"Aviones de Papel",d:"Un muro de empatía anónimo. Lee una nota de otro/a estudiante, o dobla una para alegrar el día de alguien más.",catchDefault:"“Atrapa un avión para leer un mensaje.”",catchBtn:"Atrapar un Avión ✈️",ph:"Escribe una nota de aliento para otro/a estudiante...",foldBtn:"Doblar y Lanzar 🚀",flew:"¡Voló con éxito!",messages:["Mejorará, te lo prometo. Sigue adelante.","Sobreviviste al 100 % de tus días malos.","Respira hondo — lo estás haciendo bien.","Las notas no definen tu valor como persona.","Estoy orgulloso/a de ti solo por presentarte hoy.","Descansar no es una pérdida de tiempo.","Alguien ahí afuera está animándote ahora mismo.","Está bien no tenerlo todo resuelto.","Eres suficiente, tal como eres.","Un día a la vez. Eso es todo."]}

faq:[{q:"¿Cómo reservo cita con un/a consejero/a universitario/a?",a:"Puedes reservar una consulta inicial a través del portal estudiantil en línea, en “Servicios de Bienestar”. El tiempo de espera típico es actualmente de 1 a 2 semanas para casos no urgentes. Normalmente hay citas de crisis disponibles el mismo día si es necesario."},{q:"¿Ver a un/a consejero/a afectará mi expediente académico?",a:"Para nada. Los registros de salud mental son completamente confidenciales y están separados física y digitalmente de tus expedientes académicos. Tus tutores nunca serán informados sin tu consentimiento explícito."},{q:"¿Qué es una prórroga por agotamiento?",a:"Si estás experimentando un agotamiento severo, puedes solicitar “Circunstancias Atenuantes”, que otorgan una prórroga de 7 días sin certificado médico para tu primera solicitud. Habla con tu tutor/a personal o con la oficina de bienestar estudiantil."},{q:"¿Cómo puedo unirme al Discord de MindBridge?",a:"El Discord está abierto a todos los estudiantes matriculados. Consulta nuestra biografía de Instagram (@mindbridge.eu) para el enlace de invitación seguro que rota semanalmente y protege contra el spam."},{q:"No estoy en crisis — ¿es el asesoramiento igual para mí?",a:"Sí. No necesitas estar en crisis para beneficiarte del asesoramiento. Muchos estudiantes lo encuentran útil para el estrés general, la orientación, las relaciones o la confianza académica. Piénsalo como fisioterapia — no esperas a estar roto/a."},{q:"¿Hay opciones de apoyo financiero para estudiantes?",a:"Sí. La mayoría de las universidades ofrecen fondos de emergencia, becas de urgencia y acceso a bancos de alimentos que no se publicitan ampliamente. Contacta con la oficina de bienestar estudiantil o el sindicato de estudiantes para saber qué está disponible. El estrés financiero tiene un impacto directo en la salud mental — ambos son motivos válidos para pedir ayuda."}],faq:[{q:"¿Dónde puedo encontrar apoyo?",a:"Consulta la web oficial de tu universidad para encontrar servicios de asesoramiento y apoyo estudiantil. La disponibilidad, el coste, la confidencialidad y las esperas varían según la institución."},{q:"¿MindBridge es un servicio clínico?",a:"No. MindBridge es una demostración de bienestar estudiantil y no ofrece diagnóstico, tratamiento ni atención de emergencia."},{q:"¿Qué debo hacer en una emergencia en Alemania?",a:"Si existe peligro inmediato, llama al 112. Para apoyo emocional confidencial, contacta con TelefonSeelsorge en el 116 123."}],

chat:{badge:"Compañero de Apoyo con IA",title:"Un espacio seguro para <em>desahogarte</em>.",sub:"Nuestro inteligente compañero de IA ofrece estrategias de afrontamiento personalizadas. No sustituye a la terapia profesional — pero está aquí para escuchar las 24 horas.",ph:"Escribe tu mensaje aquí...",send:"Enviar",greetingMsg:"¡Hola! Soy el compañero de IA de MindBridge. Este es un espacio seguro y sin juicios. ¿Cómo te sientes hoy?",
R:{greeting:["¡Hola! Estoy aquí para escuchar — este es un espacio seguro. ¿Cómo van las cosas?","Hola. Sea lo que sea que sientas, no tienes que cargarlo solo/a. ¿Qué tienes en mente?"],
stress:["La presión académica puede sentirse imposiblemente pesada. Intenta dividir una tarea en el paso más pequeño posible — solo la siguiente acción. ¿Has probado nuestro Centro de Enfoque?","Los exámenes y las fechas límite son estresantes, pero tus notas no definen tu valor. ¿Cuál es la cosa que se siente más abrumadora ahora mismo?","Suena como si tuvieras mucho encima. El ejercicio de respiración 4-7-8 puede ayudar a reiniciar tu sistema nervioso en menos de 5 minutos."],
sadness:["Lamento mucho que te sientas así — se necesita valor para ponerlo en palabras. No estás solo/a en esto.","Eso suena realmente difícil. Tus sentimientos son completamente válidos. Si ayuda, nuestros consejeros del campus están disponibles y es gratis.","Te escucho. Cargar con la tristeza es agotador. Estoy aquí para escuchar todo el tiempo que necesites."],
burnout:["El agotamiento es tu cuerpo pidiendo un descanso. Descansar no es pereza — es parte de rendir bien. ¿Puedes proteger al menos una hora esta noche?","Has estado esforzándote mucho durante mucho tiempo. Prueba el generador de Pausa Consciente para un reinicio de pantalla de 2 minutos. Las pequeñas pausas previenen grandes colapsos.","El agotamiento es real. Asegúrate de beber agua y comer. Las bases físicas tienen un impacto directo en el estado mental."],
positive:["¡Me alegra escuchar eso! Proteger los buenos momentos es tan importante como superar los difíciles.","Eso es maravilloso. Las pequeñas victorias importan tanto como las grandes. Mantén ese impulso.","Qué bueno escuchar eso. Mereces sentirte bien. ¡Sigue así!"],
default:["Entiendo. ¿Puedes contarme un poco más sobre cómo te hace sentir eso?","Gracias por compartir eso — se necesita valor. Sea lo que sea que estés atravesando, tomarlo un día a la vez es suficiente.","Estoy aquí para ti. A veces solo ponerlo en palabras ya es un tipo de alivio."]}
},
team:{badge:"Los Fundadores",title:"Arquitectos de <em>MindBridge</em>.",m1role:"Desarrollador Principal y Cofundador",m1bio:"Diseña el ecosistema digital de MindBridge. Como estudiante de ingeniería de software, Yiğit se enfoca en construir infraestructuras backend limpias y robustas usando Python y Java. Se asegura de que la lógica de nuestra plataforma sea lo más estructurada y resiliente posible.",m2role:"Jefe de Diseño y Cofundador",m2bio:"Aporta una estética de 'lujo silencioso' al bienestar digital. Mert cree que las herramientas de salud mental no deberían sentirse clínicas. Diseña interfaces intuitivas, minimalistas y calmantes que priorizan la paz mental sin desorden visual.",m3role:"Líder de Comunidad y Estrategia",m3bio:"Cierra la brecha entre la plataforma y el campus. Onur diseña estrategias de alcance comunitario, asegurando que nuestras herramientas se traduzcan en un impacto real. Transforma el compromiso digital en redes de apoyo genuinas y tangibles para los estudiantes."},
contact:{badge:"Ponte en Contacto",title:"Estamos aquí<br>para ti.",sub:"Ya sea que necesites apoyo profesional, quieras compartir comentarios o simplemente tengas una pregunta — contáctanos. Cada mensaje importa.",proH:"Apoyo en crisis e inmediato",proD:"MindBridge es un proyecto de demostración independiente, no un servicio clínico. En Alemania, TelefonSeelsorge ofrece apoyo gratuito y confidencial en el 116 123. En peligro inmediato, llama al 112. Consulta los canales oficiales de tu universidad para conocer el asesoramiento del campus.",callBtn:"Llamar a TelefonSeelsorge — 116 123",bookBtn:"Información oficial de apoyo",bookAlert:"",fbH:"Comentarios Anónimos",fbD:"¿Tienes una idea para una nueva herramienta? ¿Encontraste un error? ¿Quieres compartir cómo te ayudó MindBridge? En esta demo no se envían comentarios; hace falta conectar un backend para recibir mensajes.",fbPh:"Tu mensaje aquí...",fbBtn:"Enviar de Forma Anónima",fbSent:"Demo: los comentarios no se envían ni se guardan. Se necesita una conexión con el backend.",igH:"Síguenos en Instagram",igD:"Los enlaces sociales y la actividad de la comunidad no están conectados en esta demo.",dcH:"Únete a Nuestro Discord",dcD:"Las funciones de comunidad están previstas para una versión futura. Esta demo no está conectada a una comunidad activa ni a un contador real de estudiantes.",dcBtn:"Unirse al Servidor →"},
quiz:{eyebrow:"Autoevaluación Anónima",title:"¿Cómo estás <em>realmente</em>?",sub:"5 preguntas. Menos de 2 minutos. Tus respuestas no se almacenan ni se comparten. Al final recibirás una reflexión personalizada y próximos pasos concretos.",next:"Siguiente pregunta →",qCounter:"Pregunta",of:"de",selectPrompt:"Selecciona una respuesta para continuar",retake:"Repetir",exploreTools:"Explorar Herramientas →",getSupport:"Obtener Apoyo →",
QS:[
{q:"En las últimas dos semanas, ¿con qué frecuencia te has sentido cansado/a, agotado/a o sin energía?",hint:"Piensa tanto en la energía física como en la mental — no solo en la cantidad de sueño.",opts:[{l:"Rara vez o nunca",s:0,d:"Tus niveles de energía parecen relativamente estables."},{l:"Algunos días",s:1,d:"Cansancio leve que va y viene."},{l:"Más días que no",s:2,d:"La baja energía persistente merece atención."},{l:"Casi todos los días",s:3,d:"Este nivel de agotamiento puede afectar significativamente tu funcionamiento."}]},
{q:"¿Con qué frecuencia te has sentido nervioso/a, ansioso/a o al límite en las últimas dos semanas?",hint:"Incluye preocupación leve, pensamientos acelerados o una sensación general de inquietud.",opts:[{l:"Para nada",s:0,d:"La ansiedad no parece ser un factor significativo ahora mismo."},{l:"Ocasionalmente",s:1,d:"Ansiedad manejable y situacional."},{l:"Varios días a la semana",s:2,d:"Ansiedad que afecta tu experiencia diaria."},{l:"Casi constantemente",s:3,d:"Ansiedad alta que merece apoyo adecuado."}]},
{q:"En el último mes, ¿qué tan conectado/a te sientes con las personas a tu alrededor en la universidad?",hint:"Incluye compañeros de clase, compañeros de piso, amigos/as o cualquier persona del campus.",opts:[{l:"Muy conectado/a — tengo personas en las que puedo confiar",s:0,d:"El apoyo social fuerte es el factor más protector para la salud mental."},{l:"Algo conectado/a",s:1,d:"Algunas conexiones, pero quizás no tan profundas como te gustaría."},{l:"Bastante aislado/a",s:2,d:"El aislamiento social en la universidad es común pero no debe ignorarse."},{l:"Muy aislado/a — rara vez interactúo de forma significativa",s:3,d:"Aislamiento significativo que merece ser abordado directamente."}]},
{q:"¿Cómo describirías tu capacidad para concentrarte en los estudios o el trabajo académico últimamente?",hint:"No solo cuando estás cansado/a — tu capacidad general de concentración cuando te sientas a trabajar.",opts:[{l:"Bien — puedo concentrarme cuando lo necesito",s:0,d:"La concentración parece estar intacta."},{l:"Variable — algunos días buenos, otros difíciles",s:1,d:"El enfoque fluctuante es normal pero merece seguimiento."},{l:"Difícil — a menudo me siento y logro poco",s:2,d:"Las dificultades de concentración a menudo señalan estrés subyacente."},{l:"Muy difícil — incluso las tareas simples se sienten abrumadoras",s:3,d:"Este nivel de dificultad sugiere una carga mental significativa."}]},
{q:"Cuando enfrentas un período difícil, ¿cuál de estas describe mejor tu respuesta?",hint:"No hay una respuesta correcta — esto nos ayuda a entender qué tipo de apoyo podría convenirte.",opts:[{l:"Me las arreglo con mis propias estrategias",s:0,d:"Buenas habilidades de autorregulación presentes."},{l:"Busco a personas en las que confío",s:1,d:"El afrontamiento social es una fortaleza genuina."},{l:"Me retraigo y lo manejo solo/a",s:2,d:"El afrontamiento en solitario puede funcionar a corto plazo pero tiene límites."},{l:"Me siento atascado/a y no puedo tomar ninguna acción",s:3,d:"Sentirse paralizado/a es una señal que merece tomarse en serio."}]}

RESULTS:[
{range:[0,4],emoji:"🌱",bg:"#EAFBF8",col:"#0E6B5F",label:"Pareces estar sobrellevándolo bien",desc:"Tus respuestas sugieren que lo estás manejando bastante bien ahora mismo. Eso no significa que todo sea perfecto — pero tus bases parecen sólidas. Lo mejor que puedes hacer es proteger lo que funciona: mantener rutinas, conservar conexiones sociales y revisarte con regularidad.",recs:[{t:"Sé constante",d:"Los pequeños hábitos diarios se acumulan. El sueño, el movimiento y las comidas regulares importan más que cualquier intervención puntual."},{t:"Sé un recurso para otros",d:"Si estás en un buen momento, considera el programa de embajadores estudiantiles o unirte a #study-together."},{t:"Monitorea con suavidad",d:"Vuelve a hacer esta autoevaluación en unas semanas, especialmente en períodos de alta presión."},{t:"Explora historias de compañeros",d:"Lee las historias — no porque lo necesites, sino porque entender a otros construye empatía."}]},
{range:[5,9],emoji:"🌤",bg:"#FFFBEB",col:"#92400E",label:"Estrés moderado — vale la pena abordarlo",desc:"Tus respuestas indican un nivel moderado de estrés, fatiga o desconexión social. Esto es muy común entre estudiantes universitarios — pero 'común' no significa que debas simplemente aguantarlo. El estrés moderado no abordado tiende a acumularse. Ajustes relativamente pequeños pueden marcar una diferencia significativa ahora.",recs:[{t:"Conéctate con la comunidad",d:"Únete al Discord de MindBridge — especialmente #study-together o #general-chat. La sola presencia ayuda."},{t:"Habla con alguien",d:"Un/a amigo/a de confianza, un/a embajador/a estudiantil o un/a consejero/a. No necesitas estar en crisis para beneficiarte de hablar."},{t:"Un micro-hábito",d:"Una caminata de 10 minutos, un horario de sueño constante, o una comida lejos de una pantalla. Elige uno y repítelo durante una semana."},{t:"Conoce tus opciones",d:"Busca ahora el servicio de asesoramiento de tu universidad — antes de necesitarlo urgentemente — para reducir la barrera."}]},
{range:[10,15],emoji:"🌧",bg:"#FFF0F0",col:"#991B1B",label:"Estrés alto — por favor, no esperes",desc:"Tus respuestas sugieren que estás cargando actualmente con un estrés, agotamiento o angustia significativos. Este nivel de tensión afecta el sueño, la concentración, las relaciones y tu capacidad para estudiar. Puede volverse autorreforzante si no se aborda. Mereces apoyo — no cuando las cosas empeoren, sino ahora mismo.",recs:[{t:"Reserva una cita de asesoramiento",d:"Contacta hoy con los servicios de asesoramiento universitario. No necesitas un motivo 'lo suficientemente serio'. Estar luchando ya es suficiente."},{t:"Habla con tu tutor/a personal",d:"Pueden señalar adaptaciones académicas, prórrogas o derivaciones que quizás no sepas que existen."},{t:"Habla con alguien hoy",d:"Un/a amigo/a, un familiar o un/a embajador/a estudiantil de MindBridge. No tienes que navegar esto solo/a."},{t:"Recursos de crisis disponibles",d:"Si las cosas se sienten urgentes, llama al 116 123 (TelefonSeelsorge, 24/7, gratis) o usa el botón ! de este sitio."}]}
]},
footer:{tagline:"Una campaña de comunicación sobre salud mental liderada por estudiantes. Hecha por estudiantes, para estudiantes.",follow:"Seguir a @mindbridge.eu",credit:"© 2026 MindBridge."},
stories_data:[
{tag:"stress transition",n:"01",badges:[{t:"Estrés de exámenes",bg:"#FEF3C7",c:"#92400E"},{t:"Primer año",bg:"#E0F2FE",c:"#075985"}],year:"2024",title:"“Pensé que todos los demás lo tenían resuelto. Yo era la única que se estaba derrumbando.”",excerpt:"Durante mi primer período de exámenes no pude dormir durante tres noches seguidas. Seguía actualizando el portal universitario, convencida de que había suspendido todo antes incluso de que se publicaran los resultados...",full:["Durante mi primer período de exámenes no pude dormir durante tres noches seguidas. Seguía actualizando el portal universitario, convencida de que había suspendido todo antes incluso de que se publicaran los resultados. En los seminarios me quedaba completamente callada, aterrada de que si hablaba, la gente se daría cuenta de que no pertenecía allí. Llamé a mi madre una vez, pero colgué antes de que contestara porque no sabía qué decir.","Alguien de mi residencia publicó una historia de Instagram de MindBridge sobre la ansiedad ante los exámenes. La leí tres veces. Describía exactamente lo que yo sentía — no como una crisis, sino como algo real y compartido. Esa fue la primera vez que pensé que quizás no estaba rota. Usé la herramienta de autoevaluación, que me sugirió acudir a la oficina de asesoramiento. Hice una cita esa misma tarde. Seis semanas después, lo superé.","Lo que desearía que alguien me hubiera dicho antes: luchar en el primer año no significa que hayas tomado la decisión equivocada. Significa que eres humano."],outcome:"Completó el programa de asesoramiento, ahora es embajadora estudiantil"},
{tag:"social identity",n:"02",badges:[{t:"Identidad",bg:"#F3E8FF",c:"#6B21A8"},{t:"Estudiante internacional",bg:"#FCE7F3",c:"#9D174D"}],year:"2024",title:"“Nadie me advirtió que cambiar de país para estudiar una carrera podría sentirse como perderse a uno mismo.”",excerpt:"Me mudé para estudiar aquí y en dos meses había dejado de hablar con la mayoría de mis compañeros de piso — no porque fueran antipáticos, sino porque cada interacción se sentía como una actuación para la que no estaba preparado...",full:["Me mudé para estudiar aquí y en dos meses había dejado de hablar con la mayoría de mis compañeros de piso — no porque fueran antipáticos, sino porque cada interacción se sentía como una actuación para la que no estaba preparado. Mi idioma estaba bien, pero el humor, el ritmo, las referencias culturales — todo se sentía ligeramente desajustado. Empecé a comer solo y a decirle a mi familia que estaba pasando el mejor momento de mi vida.","Encontré el Discord de MindBridge a través de una publicación en Reddit. Había un canal específicamente para estudiantes internacionales. No escribí nada durante dos semanas — solo leía. Luego alguien publicó a las 2 de la madrugada diciendo que se sentía invisible en el campus, y doce personas respondieron en una hora. Escribí algo por primera vez. Alguien de mi región de origen respondió.","La soledad no desapareció de la noche a la mañana. Pero dejé de actuar. Empecé a aprender que encajar y pertenecer son dos cosas muy diferentes — solo una de ellas vale la pena perseguir."],outcome:"Cofacilita la sesión semanal de estudiantes internacionales en Discord"},
{tag:"burnout stress",n:"03",badges:[{t:"Agotamiento",bg:"#FEF2F2",c:"#991B1B"},{t:"Estudiante de máster",bg:"#F0FDF4",c:"#166534"}],year:"2023",title:"“Cumplía con todas las fechas límite y fallaba en todo lo que realmente importaba.”",excerpt:"Segundo año de mi máster. Entregaba todo a tiempo, sacaba notas decentes. Externamente estaba bien. Internamente había dejado de sentir cualquier cosa...",full:["Segundo año de mi máster. Entregaba todo a tiempo, sacaba notas decentes, asistía a todos mis seminarios. Externamente estaba bien. Internamente había dejado de sentir cualquier cosa por completo. Me sentaba en la biblioteca durante cinco horas y producía tal vez 200 palabras. Dejé de responder a mis amigos. Me decía que solo necesitaba terminar el semestre.","Un TikTok de MindBridge enumeraba los signos del agotamiento académico — baja motivación, entumecimiento emocional, agotamiento físico. Tenía todos y cada uno de ellos. Lo había estado llamando pereza durante meses. Nombrarlo cambió algo.","La herramienta de autoevaluación me sugirió considerar una prórroga de fecha límite. No sabía que existían prórrogas sin un certificado médico formal. Lo solicité. Mi departamento fue completamente comprensivo. Completé el título siete semanas después.","El sistema tiene más flexibilidad de la que nadie te cuenta. MindBridge me dijo que preguntara."],outcome:"Completó el máster. Es voluntario en el equipo de contenido"},
{tag:"social transition",n:"04",badges:[{t:"Aislamiento social",bg:"#E0F2FE",c:"#075985"},{t:"2.º año",bg:"#FEF3C7",c:"#92400E"}],year:"2024",title:"“El segundo año fue más difícil que el primero. Nadie me advirtió sobre la bajada del segundo año.”",excerpt:"El primer año tenía una estructura social incorporada: compañeros de piso, eventos de bienvenida, caos organizado. En segundo año me mudé a una casa con gente que había conocido una sola vez. El campus se vaciaba entre clases...",full:["El primer año tenía una estructura social incorporada: compañeros de piso, eventos de bienvenida, caos organizado. En segundo año me mudé a una casa con gente que había conocido una sola vez. El campus se vaciaba entre clases. Tenía más independencia y menos que hacer con ella. Empecé a pasar fines de semana enteros sin hablar con nadie en persona.","Me uní al Discord de MindBridge sobre todo para procrastinar. El canal #study-together tenía gente trabajando en tiempo real — sin video, sin presión, solo marcas de tiempo y check-ins. Empecé a unirme cada mañana. En un mes tenía una rutina informal construida en torno a los ritmos de otras personas. Suena pequeño. Ayudó enormemente.","Lo que necesitaba no era terapia ni intervención — era estructura y presencia. La comunidad me dio eso."],outcome:"Ahora organiza sesiones semanales de coworking #study-together"},
{tag:"identity burnout",n:"05",badges:[{t:"Identidad",bg:"#F3E8FF",c:"#6B21A8"},{t:"Agotamiento",bg:"#FEF2F2",c:"#991B1B"}],year:"2024",title:"“Estaba estudiando algo en lo que ya no creía. Admitirlo se sentía como un fracaso.”",excerpt:"A mitad de segundo año me di cuenta de que había elegido la carrera equivocada — no la universidad equivocada, la materia equivocada. Cambiar de carrera se sentía como admitir que había desperdiciado el tiempo de todos...",full:["A mitad de segundo año me di cuenta de que había elegido la carrera equivocada — no la universidad equivocada, la materia equivocada. Todo lo que estudiaba se sentía desconectado de lo que realmente quería. Pero no podía decir eso. Cambiar de carrera se sentía como admitir que había desperdiciado el tiempo y el dinero de todos.","Empecé a saltarme clases. Luego tutorías. La asistencia bajó a alrededor del 40 %. Le decía a mis padres que todo estaba bien. Por dentro estaba en un pánico constante de bajo nivel, alternando entre culpa, aburrimiento y temor.","Una publicación de Instagram de MindBridge preguntaba: “¿Estás luchando con tus estudios, o luchando con la dirección?” Hice una captura de pantalla y la miré durante una semana. Luego reservé una cita con un/a asesor/a académico/a. Había más opciones de las que pensaba. Me transferí de carrera el semestre siguiente.","Ahora estoy estudiando lo que realmente quería. Mi asistencia es del 94 %. Cambiar de opinión no es un fracaso. Quedarse en un lugar que no es adecuado para ti es un camino mucho más difícil."],outcome:"Se transfirió de carrera con éxito. 94 % de asistencia en la nueva carrera"},
{tag:"stress social",n:"06",badges:[{t:"Estrés financiero",bg:"#FEF3C7",c:"#92400E"},{t:"Estudiante a tiempo parcial",bg:"#F0FDF4",c:"#166534"}],year:"2023",title:"“Trabajaba 25 horas a la semana y fingía que eso era normal. No lo era.”",excerpt:"Pagué la mayor parte de mi carrera yo mismo/a. Eso significaba trabajar dos días a la semana por el salario mínimo e intentar actuar como estudiante a tiempo completo los otros cinco. Siempre iba atrasado/a, siempre disculpándome...",full:["Pagué la mayor parte de mi carrera yo mismo/a — trabajando dos días a la semana, tratando de actuar como estudiante a tiempo completo los otros cinco. Siempre iba atrasado/a, siempre disculpándome por estar cansado/a, siempre comparándome con compañeros de clase que tenían tiempo para hacer las lecturas dos veces.","El estrés no era solo académico — era la vergüenza de ello. La sensación de que necesitaba ocultar el hecho de que estaba luchando financieramente. No hablaba de ello porque pensaba que me haría parecer menos serio/a.","Un boletín de MindBridge tenía un número sobre el bienestar financiero y el impacto de la presión económica en la salud mental. Enumeraba fondos de emergencia, becas y acceso a bancos de alimentos que no sabía que existían. Solicité dos fondos. Recibí uno. Cubrió un mes de alquiler.","El estrés financiero y la salud mental no son conversaciones separadas. Me alegra que MindBridge los trate como conectados."],outcome:"Recibió una beca de emergencia. Ahora asesora al equipo editorial del boletín"}
]
};

/* ══════════════════ I18N ENGINE ══════════════════ */
let curLang = 'en';
try { const savedLang=localStorage.getItem('mb_lang'); if(Object.hasOwn(I18N,savedLang)) curLang=savedLang; } catch (_) {}
function T(){return I18N[curLang];}
function getPath(obj,path){return path.split('.').reduce((o,k)=>(o==null?undefined:o[k]),obj);}
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{const v=getPath(T(),el.getAttribute('data-i18n'));if(v!=null)el.textContent=v;});
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{const v=getPath(T(),el.getAttribute('data-i18n-html'));if(v!=null)el.innerHTML=v;});
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{const v=getPath(T(),el.getAttribute('data-i18n-placeholder'));if(v!=null)el.placeholder=v;});
  document.documentElement.lang=curLang;
  document.documentElement.setAttribute('data-lang',curLang);
  document.getElementById('lang-btn-label').textContent=curLang.toUpperCase();
  document.querySelectorAll('.lang-opt').forEach(o=>o.classList.toggle('active',o.dataset.lang===curLang));
}
function renderMarquee(){
  const items=T().marquee;
  const html=items.map(s=>`<span>${s}</span><span class="marquee-dot">·</span>`).join('');
  document.getElementById('marquee-inner').innerHTML=html+html;
}
function renderStories(){
  const list=document.getElementById('stories-list');
  list.innerHTML=T().stories_data.map((s,i)=>`
    <div class="story-item" data-tag="${s.tag}" onclick="toggleS(this)">
      <div class="story-num">${s.n}</div>
      <div class="story-body">
        <div class="story-meta">
          <span class="anon-badge">${T().stories.anon}</span>
          ${s.badges.map(b=>`<span class="s-tag" style="background:${b.bg};color:${b.c}">${b.t}</span>`).join('')}
          <span class="story-yr">${s.year}</span>
        </div>
        <div class="story-title">${s.title}</div>
        <p class="story-excerpt">${s.excerpt}</p>
        <div class="story-full-text">${s.full.map(p=>`<p>${p}</p>`).join('')}<div class="story-outcome">${T().stories.outcome} ${s.outcome}</div></div>
      </div>
      <div class="story-expand">+</div>
    </div>`).join('');
}
function renderLibrary(){
  document.getElementById('faq-list').innerHTML=T().library.faq.map(f=>`<div class="faq-item" onclick="toggleFAQ(this)"><div class="faq-question">${f.q}<span class="faq-icon">+</span></div><div class="faq-answer"><p>${f.a}</p></div></div>`).join('');
  document.getElementById('lib-cards').innerHTML=T().library.libcards.map(c=>`<div class="lib-card"><span class="tag">${c.tag}</span><h4>${c.h}</h4><p>${c.d}</p></div>`).join('');
  document.getElementById('zones-list').innerHTML=T().library.zones.map(z=>`<div class="zone-item" style="border-left-color:${z.c}"><div class="zone-icon">${z.icon}</div><div class="zone-info"><h4>${z.h}</h4><p>${z.d}</p></div></div>`).join('');
}
function renderChatGreeting(){
  const hist=document.getElementById('chat-history');
  if(hist.children.length<=1){hist.innerHTML=`<div class="chat-msg msg-ai">${T().chat.greetingMsg}</div>`;}
}
function renderZenStatus(){document.getElementById('zen-status').textContent=T().tools.zen.stages[zenLevel];}
function renderAll(){
  applyI18n();renderMarquee();renderStories();renderLibrary();renderChatGreeting();renderZenStatus();

/* ══════════════════ ZEN CANVAS ══════════════════ */
let zPoints=[],zenCanvasInit=false;
function initZenCanvas(){
  if(zenCanvasInit)return;zenCanvasInit=true;
  const canvas=document.getElementById('zen-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  let drawing=false;
  canvas.addEventListener('mousedown',()=>drawing=true);
  canvas.addEventListener('mouseup',()=>drawing=false);
  canvas.addEventListener('mouseleave',()=>drawing=false);
  canvas.addEventListener('mousemove',e=>{
    if(!drawing)return;
    const r=canvas.getBoundingClientRect();
    zPoints.push({x:(e.clientX-r.left)*(canvas.width/r.width),y:(e.clientY-r.top)*(canvas.height/r.height),age:0});
  });
  canvas.addEventListener('touchstart',e=>{drawing=true;e.preventDefault()},{passive:false});
  canvas.addEventListener('touchend',()=>drawing=false);
  canvas.addEventListener('touchmove',e=>{
    if(!drawing)return;
    const r=canvas.getBoundingClientRect(),t=e.touches[0];
    zPoints.push({x:(t.clientX-r.left)*(canvas.width/r.width),y:(t.clientY-r.top)*(canvas.height/r.height),age:0});
    e.preventDefault();
  },{passive:false});
  (function drawF(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let i=zPoints.length-1;i>=0;i--){
      const p=zPoints[i];p.age+=1;
      const op=1-(p.age/110),rad=4+(p.age/6);
      if(op<=0){zPoints.splice(i,1);continue;}
      ctx.beginPath();ctx.arc(p.x,p.y,rad,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,111,176,${op*.22})`;ctx.fill();
    }
    requestAnimationFrame(drawF);
  })();
}

function handleChatEnter(e){if(e.key==='Enter')sendChatMessage();}
function getResp(input){
  const t=input.toLowerCase(),R=T().chat.R;
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  if(t.match(/(hi|hello|hey|morning|evening|howdy|merhaba|selam|hallo|hola)/))return pick(R.greeting);
  if(t.match(/(stress|exam|test|overwhelm|deadline|fail|anxi|worry|too much|panic|sınav|stres|kaygı|prüfung|stress|angst|examen|ansied)/))return pick(R.stress);
  if(t.match(/(sad|depress|alone|lonely|cry|hopeless|bad|empty|numb|üzgün|yalnız|traurig|einsam|triste|solo)/))return pick(R.sadness);
  if(t.match(/(tired|sleep|exhaust|burnout|can't focus|energy|drained|yorgun|tükenmiş|müde|erschöpft|cansado|agotado)/))return pick(R.burnout);
  if(t.match(/(thank|good|happy|great|better|win|well|fine|iyi|teşekkür|danke|gut|gracias|bien)/))return pick(R.positive);
  return pick(R.default);
}

/* ══════════════════ MORPH CURSOR — spring physics, fluid follow ══════════════════ */
const cur=document.getElementById('cursor'),ring=document.getElementById('cursor-ring');
let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,rx=mx,ry=my,lastX=mx,lastY=my,vel=0;
let curScale=1,ringScale=1;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cur.classList.remove('hidden');ring.classList.remove('hidden');});
document.addEventListener('mouseleave',()=>{cur.classList.add('hidden');ring.classList.add('hidden');});
(function animCursor(){
  vel=Math.min(Math.hypot(mx-lastX,my-lastY),40);lastX=mx;lastY=my;
  cx+=(mx-cx)*.32;cy+=(my-cy)*.32;
  rx+=(mx-rx)*.16;ry+=(my-ry)*.16;
  const cs=curScale+Math.min(vel/90,.35),rs=ringScale+Math.min(vel/220,.15);
  cur.style.transform=`translate(${cx-9}px,${cy-9}px) scale(${cs})`;
  ring.style.transform=`translate(${rx-19}px,${ry-19}px) scale(${rs})`;
  requestAnimationFrame(animCursor);
})();
function bindCursorTargets(){
  document.querySelectorAll('a,button,.opt,.lib-card,.story-item,.faq-item,input,textarea').forEach(el=>{
    if(el.dataset.cursorBound)return;el.dataset.cursorBound='1';
    el.addEventListener('mouseenter',()=>{
      const label=el.getAttribute('data-cursor');
      if(label){ring.classList.add('label-mode');ring.style.width='';ring.style.height='';ring.textContent=label;ring.style.borderRadius='30px';ring.style.padding='0 16px';curScale=0;ringScale=1;}
      else{curScale=1.25;ringScale=1.45;ring.style.opacity='.8';}
    });
    el.addEventListener('mouseleave',()=>{
      ring.classList.remove('label-mode');ring.textContent='';ring.style.padding='';ring.style.borderRadius='50%';
      curScale=1;ringScale=1;ring.style.opacity='.5';
    });
  });
}

/* ══════════════════ STAT COUNT-UP ══════════════════ */
function bindCountUp(){
  document.querySelectorAll('.stat-n').forEach(el=>{
    if(el.dataset.countBound)return;
    const m=el.textContent.match(/^(\d+)([%+]?)$/);
    if(!m)return;
    el.dataset.countBound='1';
    const target=parseInt(m[1],10),suffix=m[2];
    const io=new IntersectionObserver(entries=>{
      entries.forEach(en=>{

 soundStatus.textContent=audioState==='playing'?T().tools.sound.playing+' · '+C().names[audioIndex]:audioState==='loading'?C().loading:audioState==='error'?C().audioError:audioState==='unsupported'?C().unsupported:C().stopped;
 labelText.textContent=C().volume;output.textContent=Math.round(volume*100)+'%';audioStop.textContent=C().stop;audioStop.disabled=audioState!=='playing'&&audioState!=='loading';
}
function release(instance){if(!instance)return;for(const source of instance.sources){try{source.stop();}catch(_){}try{source.disconnect();}catch(_){}}for(const node of instance.nodes){try{node.disconnect();}catch(_){}}try{const closing=instance.ctx.close();closing?.catch(()=>{});}catch(_){} }
function stopAudio(){audioGeneration++;const old=audio;audio=null;audioIndex=-1;audioState='idle';release(old);audioView();}
function configureAudio(instance,index){
 const {ctx}=instance,gain=ctx.createGain();instance.gain=gain;instance.nodes.push(gain);gain.gain.value=0;gain.connect(ctx.destination);
 if(index===2){
  // Three low-amplitude sine waves. Explicitly soft tones, not a music recording.
  [174.61,220,261.63].forEach(f=>{const oscillator=ctx.createOscillator(),level=ctx.createGain();oscillator.type='sine';oscillator.frequency.value=f;level.gain.value=.08;oscillator.connect(level);level.connect(gain);instance.sources.push(oscillator);instance.nodes.push(level);oscillator.start();});
 }else{
  const buffer=ctx.createBuffer(1,ctx.sampleRate*8,ctx.sampleRate),samples=buffer.getChannelData(0);let last=0;
  for(let i=0;i<samples.length;i++){const white=Math.random()*2-1;if(index===1){last=(last+.02*white)/1.02;samples[i]=last*3.5;}else samples[i]=white*.35;}
  // Crossfade the loop boundaries to avoid periodic clicks.
  const fade=Math.min(1024,samples.length/4);for(let i=0;i<fade;i++){const t=(i+1)/fade;const k=samples.length-fade+i;samples[k]=samples[k]*(1-t)+samples[0]*t;}
  const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter();source.buffer=buffer;source.loop=true;filter.type='lowpass';filter.frequency.value=index===0?2500:450;source.connect(filter);filter.connect(gain);instance.sources.push(source);instance.nodes.push(filter);source.start();
 }
 gain.gain.setTargetAtTime(volume,ctx.currentTime,.06);
}
window.toggleSound=async(_button,index)=>{
 if(!Number.isInteger(index)||index<0||index>2)return;
 if(audioIndex===index&&(audioState==='playing'||audioState==='loading')){stopAudio();return;}
 stopAudio();const generation=audioGeneration,AudioCtor=window.AudioContext||window.webkitAudioContext;
 if(!AudioCtor){audioState='unsupported';audioView();return;}
 audioIndex=index;audioState='loading';audioView();let instance;
 try{
  const ctx=new AudioCtor();instance={ctx,sources:[],nodes:[],gain:null};audio=instance;
  await ctx.resume();if(generation!==audioGeneration){release(instance);return;}
  if(ctx.state!=='running')throw Error('Audio context not running');
  configureAudio(instance,index);audioState='playing';audioView();
  ctx.onstatechange=()=>{if(audio===instance&&audioState==='playing'&&ctx.state!=='running')stopAudio();};
 }catch(_){release(instance);if(generation!==audioGeneration)return;audio=null;audioIndex=-1;audioState='error';audioView();}
};
range.addEventListener('input',()=>{volume=Math.max(0,Math.min(1,Number(range.value)/100));if(audio?.gain)audio.gain.gain.setTargetAtTime(volume,audio.ctx.currentTime,.03);audioView();});
function cleanup(){pauseTimer();stopBreathing();stopAudio();}
const previousShowPage=window.showPage;window.showPage=function(id){if(id!=='tools')cleanup();return previousShowPage(id);};
document.addEventListener('visibilitychange',()=>{if(document.hidden)cleanup();});
window.addEventListener('pagehide',cleanup);
const previousI18n=window.applyI18n;window.applyI18n=function(){previousI18n();translate();};
function translate(){
 resetBtn.textContent=C().reset;minuteInput.setAttribute('aria-label',C().duration);
 document.querySelector('[data-i18n="tools.timer.d"]').textContent=C().timerDesc;
 document.querySelector('[data-i18n="tools.breath.d"]').textContent=C().breathDesc;
 document.querySelector('[data-i18n="tools.sound.d"]').textContent=C().soundDesc;
 el('mb-tools-policy').textContent=C().policy;timerView();breathView();audioView();
}
const policy=document.createElement('p');policy.id='mb-tools-policy';policy.className='mb-stage3-policy';document.querySelector('#page-tools .section').append(policy);
translate();
})();
